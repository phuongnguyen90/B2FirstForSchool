y with my ideas on how to make the world a more sustainable place. There were over 20,000 young people from all over the world there. I talked to so many incredible and inspiring teenagers like me who were committed to improving their community and protecting the planet. The best talk I attended was given by Melati Wijsen. Melati, and her sister Isabel, are the Indonesian founders of Bye Bye Plastic Bags. They have spoken to over one million young people about the harmful impact of plastic bags on the environment. They've also written educational booklets for children in Indonesia. Their initiative was so successful that it led to an official ban of plastic bags in Bali, where they were born."}], "lead": "Which speaker", "questions": [[43, "describes their favourite activist as bold?"], [44, "has seen the activist they admire in person?"], [45, "supports a cause related to education?"], [46, "admires an activist who uses the internet to get their message across?"], [47, "sent a message to an activist?"], [48, "says that the activist changed their hometown?"], [49, "mentions an activist with an official position?"], [50, "talks about an activist who is passionate about a natural resource?"], [51, "says that the activists have written material aimed at schools?"], [52, "says that the activist they admire used to miss lessons?"]]}]},
    {"id": "t4", "title": "Test 4", "parts": [{"id": "p1", "label": "Part 1", "name": "Multiple-choice cloze", "type": "cloze", "variant": "mc", "instr": "For questions 1–8, read the text below and decide which answer (A, B, C or D) best fits each gap. There is an example at the beginning (0).<br><b>Example:</b> (0) A nowhere &nbsp; B places &nbsp; <b>C anywhere</b> &nbsp; D somewhere", "title": "The future of cloud storage", "paragraphs": ["Cloud storage allows people and businesses to store and access data from {{0:anywhere}} in the world. As we move towards a more digital world, cloud storage is likely to become more important. One current {{1}} in cloud storage is edge computing. Edge computing involves storing data closer to the end-user, which improves performance. This means that {{2}} of storing all data in centralised data centres, it will be stored in smaller, distributed servers located nearer {{3}} the user. This approach will {{4}} faster processing and reduce the load on central servers.", "Another expectation for the future of cloud storage is the {{5}} use of artificial intelligence and machine learning. These technologies improve data management and analysis. {{6}}, this will help businesses make better decisions based on their data. As cloud storage becomes more {{7}}, security will become a major concern. However, with the development of better encryption methods and improved security protocols, cloud storage providers will be able to offer more secure storage solutions. One thing we are sure of is that if businesses continue to {{8}} on digital data, cloud storage will play a more important role in managing and accessing that data."], "choices": {"1": ["forecast", "prediction", "expect", "trend"], "2": ["unless", "except", "instead", "rather"], "3": ["to", "than", "for", "until"], "4": ["permit", "enable", "able", "allow"], "5": ["growth", "more", "often", "increasing"], "6": ["However", "Moreover", "Nevertheless", "Addition"], "7": ["usual", "common", "normal", "natural"], "8": ["rely", "believe", "trust", "understand"]}}, {"id": "p2", "label": "Part 2", "name": "Open cloze", "type": "cloze", "variant": "open", "instr": "For questions 9–16, read the text below and think of the word which best fits each gap. Use only <strong>one</strong> word in each gap. There is an example at the beginning (0).", "title": "The dance of honeybees", "paragraphs": ["Have you ever noticed how fascinating the dance of honeybees is? This behaviour is used {{0:BY}} worker bees to communicate {{9}} food sources are to other members of their colony. When a worker bee spots a good source {{10}} pollen, it returns to the hive and performs a dance to show the direction and distance of the food source to {{11}} fellow bees. The dance consists of movements {{12}} as circles, figure eights and waggle runs. The orientation of the dance {{13}} relation to the sun indicates the direction of the food source, {{14}} the duration and intensity of the waggle runs indicate the distance. Other bees in the hive are {{15}} to interpret this information and go to the food source using a combination of visual and olfactory cues.", "Studies have shown that different species of bees have different ways of doing the waggle dance, each species' or subspecies' dance varying by either curve {{16}} duration. This dance is crucial to the survival of the colony as it allows the bees to gather food in an efficient manner and maintain a healthy bee population."]}, {"id": "p3", "label": "Part 3", "name": "Word formation", "type": "cloze", "variant": "wordform", "instr": "For questions 17–24, read the text below. Use the word given in capitals at the end of some of the lines to form a word that fits in the gap <strong>in the same line</strong>. There is an example at the beginning (0).", "title": "What is a black hole?", "paragraphs": ["A black hole is a region in space where gravity is so strong that {{0:ABSOLUTELY|ABSOLUTE}} nothing can escape it. It is {{17}} strong. There is no {{18}} from gravity, even for light. This happens when a massive star collapses under its own {{19}}. Its matter is compressed into a tiny point known as a 'singularity'. The area around the singularity is called the 'event horizon'. Anything beyond that point will be trapped by the forces of gravity.", "The size of black holes varies {{20}}, ranging from a few times the mass of our sun to supermassive ones. They cannot be seen through telescopes as they do not emit any light, but their {{21}} can be noticed. This is because they affect the {{22}} matter in a visible way. When anything falls into a black hole, it heats up and emits energy in the form of X-rays, allowing {{23}} to detect them.", "Black holes are fascinating objects that challenge our {{24}} of the laws of physics. They give us new knowledge about how the universe works."], "stems": {"17": "EXTREME", "18": "PROTECT", "19": "WEIGH", "20": "GREAT", "21": "PRESENT", "22": "SURROUND", "23": "ASTRONOMY", "24": "UNDERSTAND"}}, {"id": "p4", "label": "Part 4", "name": "Key word transformations", "type": "kwt", "instr": "For questions 25–30, complete the second sentence so that it has a similar meaning to the first sentence, using the word given. <strong>Do not change the word given.</strong> You must use between <strong>two</strong> and <strong>five</strong> words, including the word given.", "example": {"orig": "Polly is so gifted as a painter.", "key": "SUCH", "pre": "Polly is", "ans": "SUCH A GIFTED", "post": "painter."}, "items": [{"n": 25, "orig": "She continued to talk about her accomplishments.", "key": "CARRIED", "pre": "She", "post": "about her accomplishments."}, {"n": 26, "orig": "Most people believe the burglar was a relative.", "key": "BELIEVED", "pre": "The burglar", "post": "a relative."}, {"n": 27, "orig": "Nobody expected that to happen so soon.", "key": "SAW", "pre": "Nobody", "post": "so soon."}, {"n": 28, "orig": "Is Philip going to ask the mechanic to fix his car tomorrow?", "key": "HAVE", "pre": "Is Philip going to", "post": "tomorrow?"}, {"n": 29, "orig": "I can't stand his behaviour when his sister isn't around.", "key": "FED", "pre": "I'm", "post": "his behaviour when his sister isn't around."}, {"n": 30, "orig": "I have no problem with doing the dishes.", "key": "MIND", "pre": "I", "post": "the dishes."}]}, {"id": "p5", "label": "Part 5", "name": "Multiple choice", "type": "mc", "instr": "You are going to read an extract from the novel <em>Alice in Wonderland</em>. For questions 31–36, choose the answer (A, B, C or D) which you think fits best according to the text.", "passage": ["Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do. Once or twice she had looked into the book her sister was reading, but it had no pictures or conversations in it, 'and what is the use of a book', thought Alice 'without pictures or conversations?'", "So she was considering, in her own mind (as well as she could; as the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her.", "There was nothing so very strange about that, and it even seemed quite natural to Alice to hear the Rabbit say to itself, 'Oh dear! Oh dear! I shall be late!' However, when the Rabbit took a watch out of its pocket, and looked at it, and then hurried on, Alice jumped to her feet. It flashed across her mind that she had never seen a rabbit with either a pocket, or a watch to take out of it. Feeling curious, she ran across the field after it, and fortunately was just in time to see it pop down a large rabbit-hole under the hedge.", "In another moment down went Alice after it, never once considering how she would get out again. The rabbit-hole went straight on like a tunnel for some way, and then dropped suddenly down, so suddenly that Alice did not have time to think about stopping. She found herself falling down a very deep well. Either the well was very deep, or she fell very slowly, because she had plenty of time to look about her and to wonder what was going to happen next.", "First, she tried to look down and find out where she was going, but it was too dark to see anything. Then she looked at the sides of the well and noticed that they were filled with cupboards and bookshelves. Here and there she saw maps and pictures hung upon pegs. She took down a jar from one of the shelves as she passed; it was labelled 'ORANGE MARMALADE', but to her great disappointment it was empty. She did not want to drop the jar in case it hit someone below her, so she managed to put it into one of the cupboards as she fell past it.", "Down, down, down. Would the fall never come to an end? 'I wonder how many miles I've fallen by this time?' she said aloud. 'I must be getting somewhere near the centre of the earth. Let me see: that would be four thousand miles down, I think, but I'm not sure.' Alice had learnt about this in her geography lessons in school. Though this was not a very good opportunity for showing off her knowledge, since there was no one to listen to her, it was still good practice to say it over. 'Yes, that's about the right distance – but then I wonder what Latitude or Longitude I've got to?' Alice had no idea what Latitude was, or Longitude either, but thought they were nice grand words to say."], "source": "Adapted from Alice in Wonderland, by Lewis Carroll.", "questions": [{"n": 31, "q": "In the first paragraph, what can we imply about Alice's taste in books?", "o": ["She likes all kinds of books.", "She prefers illustrated books.", "She likes non-fiction books.", "She loves whatever her sister read."]}, {"n": 32, "q": "How did Alice react when she first saw the rabbit?", "o": ["She was scared.", "She didn't understand why the rabbit was there.", "She found the rabbit strange.", "She thought it was normal."]}, {"n": 33, "q": "Why did Alice run after the rabbit?", "o": ["to find out the time", "to know more about it", "to stretch her legs", "to see if the rabbit was wearing clothes"]}, {"n": 34, "q": "What word can we use to describe how Alice was feeling in paragraph 4?", "o": ["calm", "worried", "afraid", "excited"]}, {"n": 35, "q": "What did Alice find in the jar?", "o": ["marmalade", "a map", "nothing", "pictures and pegs"]}, {"n": 36, "q": "What can we imply about Alice's knowledge of geography?", "o": ["She likes to impress the teacher.", "She can measure distance.", "She remembers words but not what they mean.", "She understands about maps and distance."]}]}, {"id": "p6", "label": "Part 6", "name": "Gapped text", "type": "gapped", "instr": "You are going to read a newspaper article about body clocks and sleep. Six sentences have been removed from the article. Choose from the sentences <strong>A–G</strong> the one which fits each gap (37–42). There is <strong>one extra sentence</strong> which you do not need to use.", "title": "Our body clocks", "options": {"A": "According to some studies, the blue light emitted from screens can interfere with the body's natural production of melatonin, making it harder to fall asleep.", "B": "However, a study has shown that the main causes for this feeling are problems in keeping healthy relationships with friends.", "C": "This means they naturally feel more awake later at night and have a harder time waking up early in the morning.", "D": "A simple internet search for 'five-minute relaxation yoga' or similar will bring up hundreds of easy-to-follow videos that you can do in your bedroom.", "E": "Avoid caffeine and sugary foods before bed as these can interfere with sleep and lead to restless nights.", "F": "Some of these are improved mood, reduced stress and anxiety, and improved overall mental well-being.", "G": "It can also have a big impact on performance at school."}, "paragraphs": ["Our body clocks, also known as our circadian rhythms, are natural biological processes that regulate our sleep-wake cycle and other bodily functions. These rhythms are controlled by a part of our brain called the suprachiasmatic nucleus. It responds to light and darkness to regulate our internal clock. While everyone's body clock is different, research has shown that teenagers have a later circadian rhythm. {{37}} However, despite these natural tendencies, it is crucial for teenagers to get a decent amount of sleep to promote optimal mental health.", "Studies have shown that getting enough sleep has numerous positive effects on mental health. {{38}} During sleep, our bodies release hormones that help regulate mood and stress levels, such as cortisol and serotonin. Therefore, adequate sleep can help regulate these hormones and prevent mood swings.", "Despite the importance of sleep for mental health, many teenagers struggle to get enough sleep. School schedules, extracurricular activities, social events and social media can all affect sleep patterns. Lack of sleep can make you feel irritable, cause mood swings and lower your mood. {{39}} Feeling tired can lead to difficulties concentrating and remembering information.", "Therefore, it is essential for teenagers to prioritise sleep and develop healthy sleep habits. If you aren't sure how to improve your sleep, creating a consistent sleep schedule is a good starting point. Try to go to bed and wake up at the same time every day, even on weekends. Another useful tip is considering where you sleep. A peaceful, sleep-friendly environment will make it easier to switch off. Make sure your bedroom is quiet, dark and cool to promote optimal sleep. This includes avoiding screens before bed. {{40}}", "A good sleep routine starts before you actually get into bed. {{41}} Keep in mind that caffeine isn't just found in coffee – energy drinks and soda can contain very high levels as well.", "If you struggle to relax or find yourself tempted to reach for your phone after a couple of failed attempts to fall asleep, relaxation techniques may help. These can include activities such as deep breathing, meditation or yoga. There's no need to spend money or take a class. {{42}}", "Our body clocks play a significant role in regulating our sleep-wake cycle, and teenagers need to get a decent amount of sleep to promote optimal mental health. Developing healthy sleep routines can set you up for success."]}, {"id": "p7", "label": "Part 7", "name": "Multiple matching", "type": "matching", "instr": "You are going to read about four teenagers who do volunteer work. For questions 43–52, choose from the four people (<strong>A–D</strong>). The people may be chosen more than once.", "title": "Volunteer work", "subtitle": "Read about how four teenagers decide to volunteer their time to make a difference.", "people": [{"l": "A", "name": "Sam", "text": "I recently started volunteering at our local animal shelter. Working with the animals has been an incredible experience for me. Every time I walk into the shelter, I'm greeted by wagging tails and happy purrs, which instantly brightens up my day. The work is not always easy, as some animals come in injured or sick, but seeing them recover and finding their 'forever homes' are so rewarding. One of my favourite things to do is to take the dogs on walks and give them some fresh air and exercise. It's amazing to see their personalities shine through as they explore and play. Volunteering at the shelter has not only taught me about animal care but also about the importance of giving back to the community. Knowing that I'm making a difference to the animals' lives is an indescribable feeling."}, {"l": "B", "name": "Max", "text": "A soup kitchen opened in my town last winter. The cost of everyday essentials, like groceries, electricity and medicines, has been going up and many people have found that they just don't have enough money to eat. A local charity asked for helpers online and I signed up straight away. Originally, I did this to fulfil my community service hours as part of a national youth award programme, but it has turned into so much more. I'm fortunate that my parents have stable jobs, and food insecurity isn't a part of my life. Working at the soup kitchen has opened my eyes to the struggles of those who are working hard but still don't have enough to meet their basic needs. Several of my classmates and neighbours are volunteers too. It's been amazing to see the community come together."}, {"l": "C", "name": "Bella", "text": "Since I was a child, I've been passionate about the environment. I would cry if someone squashed a fly, and I used to get into a lot of trouble for sneaking bugs in jars into my bedroom because I was worried about them! That's why I've been volunteering with an environmental clean-up organisation. We are a seaside community, and I feel that we are privileged to be able to swim in the ocean every day. Unfortunately, not everyone recognises this privilege. It's shocking to see the amount of rubbish that people leave behind on the beach. We've set up a social media profile and film videos of our beach clean-ups. They don't get many views at the moment, but I hope that will change. Maybe if people see their favourite beaches covered in rubbish, they'll drop less litter."}, {"l": "D", "name": "Erica", "text": "I've been volunteering at a hospital in my community for the past year. My dream is to become a surgeon, so this role is giving me some valuable experience before I start medical school. I'm part of the support team in the paediatric unit, and I help with activities and playtime. This takes the young patients' minds off their treatments. It also gives parents a short break so they can grab a coffee or have a nap. People often tell me how inspiring it is that I give up my weekends to volunteer at the hospital, but I always correct them. The patients inspire me – they are so resilient in the face of their illnesses. Several of them are in long-term treatment, and they've become like my little brothers and sisters."}], "lead": "Which speaker", "questions": [[43, "mentions other people who also join them in the volunteer work?"], [44, "can use their volunteering experience in the career they chose for the future?"], [45, "learnt how important it is to take care of other creatures?"], [46, "uses technology to promote their work?"], [47, "considers those they volunteer for like family?"], [48, "enjoys the way those they volunteer for say hello to them?"], [49, "lives and volunteers near the seashore?"], [50, "started doing volunteer work because they needed to?"], [51, "has always felt bad when an animal was killed?"], [52, "helps people who can't afford things?"]]}]},
    {"id": "t5", "title": "Test 5", "parts": [{"id": "p1", "label": "Part 1", "name": "Multiple-choice cloze", "type": "cloze", "variant": "mc", "instr": "For questions 1–8, read the text below and decide which answer (A, B, C or D) best fits each gap. There is an example at the beginning (0).<br><b>Example:</b> (0) A would &nbsp; B can &nbsp; <b>C may</b> &nbsp; D can't", "title": "Do flies have special powers?", "paragraphs": ["You {{0:may}} have noticed that flies are able to walk on ceilings and other smooth surfaces, but do you know why? It is due to the specialised structure of their legs. Flies have an incredibly strong grip that {{1}} them to hold on to surfaces {{2}} when they are upside down. This grip is achieved through the use of tiny claws {{3}} the end of each leg. Each of their six legs is equipped with tiny pads that are {{4}} in thousands of microscopic hairs, called setae. These setae can form strong adhesive bonds with surfaces, allowing the fly to stick to the ceiling without {{5}} off.", "But what about the way they {{6}} to get unstuck? Flies use a few techniques for that. These include pushing, twisting and peeling their tiny foot pads free. Scientists {{7}} been studying other insect species to see if this ability is also present in them. What they know so {{8}} is that most insects that have a similar ability combine the feet hairs' rounded tips, a four-feet-on-the-floor rule and also the oily fluid to take steps in the direction they want."], "choices": {"1": ["allows", "shows", "lets", "makes"], "2": ["even", "sometimes", "always", "never"], "3": ["on", "in", "at", "to"], "4": ["full", "covered", "protected", "made"], "5": ["dropping", "collapsing", "going", "falling"], "6": ["manage", "succeed", "capacitate", "can"], "7": ["have", "were", "could", "are"], "8": ["little", "now", "much", "far"]}}, {"id": "p2", "label": "Part 2", "name": "Open cloze", "type": "cloze", "variant": "open", "instr": "For questions 9–16, read the text below and think of the word which best fits each gap. Use only <strong>one</strong> word in each gap. There is an example at the beginning (0).", "title": "Pluto, the former planet", "paragraphs": ["Pluto was first discovered {{0:IN}} 1930 and was considered the ninth planet in the solar system for {{9}} 75 years. However, in 2006, the International Astronomical Union (IAU) redefined the criteria for {{10}} constitutes a planet, and Pluto was reclassified {{11}} a dwarf planet or planetoid.", "The IAU's decision was based on several factors. Firstly, Pluto's size is much smaller than that of the eight planets in the solar system, and it does not have a clear path around the Sun. Instead, it shares its orbit {{12}} other objects in the Kuiper Belt. Additionally, Pluto's composition and characteristics are more similar {{13}} those of other Kuiper Belt objects, {{14}} are considered to be distinct from planets.", "The decision to reclassify Pluto as a 'dwarf planet' was not without controversy, as many people were attached to the idea of Pluto being a planet and saw the decision as a demotion. The IAU's decision, however, {{15}} based on scientific evidence and on a desire to create a more accurate and consistent classification system {{16}} objects in the solar system."]}, {"id": "p3", "label": "Part 3", "name": "Word formation", "type": "cloze", "variant": "wordform", "instr": "For questions 17–24, read the text below. Use the word given in capitals at the end of some of the lines to form a word that fits in the gap <strong>in the same line</strong>. There is an example at the beginning (0).", "title": "What came first after all, the chicken or the egg?", "paragraphs": ["The question of whether the egg or the chicken came first has puzzled people for centuries. From a {{0:BIOLOGICAL|BIOLOGY}} perspective, it is generally accepted that the egg came first, as it is the result of a {{17}} or variation in the DNA of a bird or its prehistoric ancestor. This transformation would have caused the bird to lay eggs with a hard {{18}} shell, which is what allowed for the embryo's {{19}} and for its hatching outside of the mother's body.", "This {{20}} process is believed to have occurred millions of years ago, long before the {{21}} of the modern chicken. Therefore, the egg came first, laid by a bird that was not yet a chicken. This {{22}} is supported by scientific evidence, including fossils and genetic studies.", "However, from the viewpoint of philosophy, the answer to this question may be less simple. Some people say that it depends {{23}} on each person's perspective and beliefs. Following this {{24}}, therefore, there may not be an answer at all!"], "stems": {"17": "MUTATE", "18": "OUT", "19": "DEVELOP", "20": "EVOLVE", "21": "EXIST", "22": "CONCLUDE", "23": "ENTIRE", "24": "ARGUE"}}, {"id": "p4", "label": "Part 4", "name": "Key word transformations", "type": "kwt", "instr": "For questions 25–30, complete the second sentence so that it has a similar meaning to the first sentence, using the word given. <strong>Do not change the word given.</strong> You must use between <strong>two</strong> and <strong>five</strong> words, including the word given.", "example": {"orig": "I spent all day on the beach.", "key": "WHOLE", "pre": "I", "ans": "SPENT THE WHOLE DAY", "post": "on the beach."}, "items": [{"n": 25, "orig": "In spite of the rain, they decided to go camping.", "key": "EVEN", "pre": "They decided to go camping", "post": "raining."}, {"n": 26, "orig": "I won't be able to help you if you don't explain it to me.", "key": "UNLESS", "pre": "I won't be able to help you", "post": "it to me."}, {"n": 27, "orig": "In order to go backpacking in the summer, we started to save money.", "key": "THAT", "pre": "We started to save money", "post": "backpacking in the summer."}, {"n": 28, "orig": "I didn't expect the film to be so bad.", "key": "WORSE", "pre": "The film", "post": "I had expected."}, {"n": 29, "orig": "Most people remove their Christmas decorations in January.", "key": "DOWN", "pre": "Most people", "post": "their Christmas decorations in January."}, {"n": 30, "orig": "'What day is Dan going to be away?' Sophie asked me.", "key": "WAS", "pre": "Sophie asked me", "post": "going to be away."}]}, {"id": "p5", "label": "Part 5", "name": "Multiple choice", "type": "mc", "instr": "You are going to read an extract from the tale <em>Jorinda and Jordindel</em>. For questions 31–36, choose the answer (A, B, C or D) which you think fits best according to the text.", "passage": ["There was once an old castle in the midst of a large and thick forest, and in it lived only an old woman. In the daytime she changed herself into a cat or a screech-owl, but in the evening she took her proper shape again as a human being. She could make wild animals and birds come to her. If a man came within one hundred paces of the castle, he was obliged to stand still and could not move from the place until she allowed him to walk free. But whenever an innocent woman came within this circle, the woman changed her into a bird, and shut her up in a cage, and carried the cage into a room in the castle. She had about seven thousand cages of rare birds in the castle.", "Now, there was once a young woman who was called Jorinda, who was fairer than all other girls. She and a handsome youth named Jorindel had promised to marry each other. They were still in the days before their marriage, and their greatest happiness was being together. One day, in order that they might be able to talk together in quiet, they went for a walk in the forest. 'Take care,' said Jorindel, 'that you do not go too near the castle.'", "It was a beautiful evening; the sun shone brightly between the trunks of the trees into the dark green of the forest, and the turtle-doves sang intensely from the branches of the birch trees. Jorinda sat to gaze at the sun, and Jorindel sat at her side. Both felt sad, but they didn't know why. They felt as if they would soon be parted from one another forever. They had walked a long way, and when they looked to see which way they should go home, they could not decide which path to take.", "The sun was setting fast, and already half of its circle had sunk behind the hill. Suddenly, Jorindel looked behind him. Through the trees he saw that they had, without knowing it, sat down close to the old walls of the castle. He felt sick with fear, turned pale and began to tremble. Jorinda was singing, when her song stopped suddenly. Jorindel turned and began to run to her. At that moment, Jorinda was changed into a nightingale, and her song ended with 'jug, jug, jug'. A screech-owl with glowing eyes flew three times round about her, and three times cried, 'to-whoo, to-whoo, to-whoo!' Jorindel stood there like a stone, and could neither cry nor speak.", "The sun had now set. The owl flew into the trees, then, directly afterwards, a crooked old woman, with large red eyes and a hooked nose, appeared. She muttered to herself, caught the nightingale, and took it in her hand. All of a sudden, Jorindel found himself free. Then he fell on his knees and begged the old woman to give him back his dear Jorinda. She just laughed at him and said he would never see her again. Then she went her way. […]"], "source": "Adapted from The Grimm Brother's Tales (Project Gutenberg https://www.gutenberg.org).", "questions": [{"n": 31, "q": "In the first paragraph, what do we learn about the woman in the castle?", "o": ["She was a bird lover.", "She protected the castle from wild animals.", "She was an innocent person who lived in a cage.", "She lived alone and transformed into animals."]}, {"n": 32, "q": "In the second paragraph, what warning is given?", "o": ["Stay away from the castle.", "Walk together in the forest.", "Don't go into the forest.", "Be quiet in the forest."]}, {"n": 33, "q": "What can we imply from line 28, 'Both felt sad, but they didn't know why'?", "o": ["They didn't want to go home.", "They could sense that something bad was going to happen.", "They felt like their relationship was over.", "They knew that they were lost."]}, {"n": 34, "q": "How does Jorindel feel in paragraph four?", "o": ["unwell", "terrified", "impatient", "upset"]}, {"n": 35, "q": "How does Jorindel react after Jorinda becomes a bird?", "o": ["He calls out to her.", "He starts crying.", "He is unable to move.", "He runs towards her."]}, {"n": 36, "q": "What can we say about the woman in the last paragraph?", "o": ["She doesn't care about Jorindel's feelings.", "She doesn't want Jorindel to leave.", "She can't speak clearly.", "She doesn't like turning into an owl."]}]}, {"id": "p6", "label": "Part 6", "name": "Gapped text", "type": "gapped", "instr": "You are going to read a news article about the happiest countries in the world. Six sentences have been removed from the article. Choose from the sentences <strong>A–G</strong> the one which fits each gap (37–42). There is <strong>one extra sentence</strong> which you do not need to use.", "title": "The happiest countries in the world", "subtitle": "What did the World Happiness Report say about countries in 2022?", "options": {"A": "In fact, it is known as one of the leading countries when it comes to a flexible employment market.", "B": "In addition, all three nations have a high level of trust in their government and institutions, which can also contribute to a sense of security and well-being.", "C": "Although a lot of positive factors can be highlighted regarding its levels of happiness, the country still faces challenges when it comes to mental health.", "D": "That means that parents are entitled to a total of 320 working days off to take care of their babies.", "E": "However, this was not one of the aspects the country had the highest score at.", "F": "But what are the reasons behind the happiness of these countries?", "G": "This is one of the reasons why it has been at the top of the list for four consecutive years."}, "paragraphs": ["Have you ever heard about the annual World Happiness Report? It ranks countries based on a number of factors that contribute to overall happiness levels. Among the criteria, there is social support, economic prosperity and personal freedom. In the 2022 report, Finland once again claimed the top spot as the world's happiest country, followed closely by Denmark and Iceland. {{37}}", "Finland, which ranked first among the happiest countries in the world, has a rich cultural heritage, with many opportunities for cultural and outdoor activities, which can significantly contribute to a person's overall sense of well-being. {{38}} The country's high ranking can be attributed to its strong social welfare system, excellent education system and a high level of trust in the government.", "Finland's strong social welfare system ensures that all citizens have access to free health care and education, as well as generous parental leave policies, where both the father and the mother can take a paid holiday. {{39}} All these factors contribute to a high level of social support, which is a key indicator of happiness. The education system in Finland is also considered one of the best in the world, with a strong focus on equality and individualised learning.", "Denmark, which ranks second on the list, also considers trust an essential value. This may be because of the Nordic economic model, where the government, businesses and people must trust each other to do whatever is best for everyone. Besides placing a high value on work-life balance, with a strong emphasis on leisure time and family life, Danish workers enjoy generous vacation time and flexibility in their work schedules. {{40}} Denmark also has a reliable cycling infrastructure, which encourages healthy living and exercising outdoors.", "Iceland ranked third in the 2022 happiness report. Its social support system, culture of acceptance and quality, transparency and justice and a strong sense of community contribute to its level of happiness. {{41}} Iceland has one of the highest rates of depression and anxiety in Europe, and a significant gender pay gap remains.", "One positive aspect that is common among the three countries is their emphasis on social connections and community. Strong social networks can provide a sense of belonging and support, which can contribute to overall happiness. {{42}} However, it is interesting to note that none of the top-ranked countries on the list have a perfect score in all areas that contribute to happiness. Finland, for instance, had a relatively low score on measures of income and wealth inequality. Denmark, on the other hand, scored low on measures of income and wealth distribution. This suggests that overall happiness is not determined by any one factor but rather by a combination of a number of factors."]}, {"id": "p7", "label": "Part 7", "name": "Multiple matching", "type": "matching", "instr": "You are going to read a newspaper article about the main benefits of eating a plant-based diet. For questions 43–52, choose from the sections (<strong>A–D</strong>). The sections may be chosen more than once.", "title": "The main benefits of eating a plant-based diet", "subtitle": "We have asked two nutritionists to tell us about the main benefits of plant-based diets, and here are the four most cited:", "people": [{"l": "A", "name": "", "text": "A diet consisting mostly of plant-based foods can help you keep a healthy weight, which is crucial for reducing your chances of developing cancer. Avoiding smoking is the only factor more important than maintaining a healthy weight in terms of cancer prevention. This is because being overweight can lead to inflammation and hormone imbalances, increasing the risk of various cancers. People who are obese tend to have a considerably higher risk of developing cancer at some point in their life, among other diseases such as diabetes and heart disease. By eating mostly plant-based foods, you eliminate many of the foods that can contribute to weight gain, and by adding regular exercise to your routine, you can set yourself on a course towards weight loss."}, {"l": "B", "name": "", "text": "Consuming high-fibre foods, such as beans, avocados and whole grains, can help to regulate the body's use of sugar, which also controls our levels of hunger. This is why a person's minimum daily consumption of fibre should be no lower than 25 grams. All unprocessed plant foods contain fibre. This means that fibre is integral to the plant's structure. Increasing your consumption of fibre provides a range of benefits such as good bowel management, improves digestive health and helps your digestive system to absorb nutrients. Fibre also helps lower cholesterol levels and makes blood sugar more stable. Moreover, it plays a fundamental role in colon cancer, which is the third most common type of the disease."}, {"l": "C", "name": "", "text": "Your immune system can also benefit from consuming a diet that is primarily made up of plant-based foods. This is because plants contain important nutrients that cannot be found in other types of food. The minerals, vitamins and antioxidants found in plants play a vital role in maintaining the health of your cells and keeping your body well-balanced. In doing so, they enable your immune system to operate in the best possible way. Foods coming only from plants give your body the resources needed to fight infections. This means that a plant-based diet can protect your immune system against microorganisms and germs. A healthy immune system can protect you from everyday viruses like colds and flu."}, {"l": "D", "name": "", "text": "Eating plant-based foods can help reduce inflammation in your body. The tiny phytochemicals and antioxidants found in plants fight off toxins from pollution, processed food, bacteria, viruses and other sources. According to dieticians, antioxidants in plants intercept unnatural substances that can disrupt your body's balance. They suggest that consuming plant-based foods and paying attention to your body's signals about how different foods affect you, can reduce inflammation. When not treated, inflammation can harm the cells and tissues in your body, and it has been linked to various inflammatory diseases like arthritis. On the other hand, it should also be noted that certain proteins that can only be found in animal products are also essential to reduce inflammation. Therefore, people who follow a plant-based diet should take care and eat alternatives to ensure they get enough protein."}], "lead": "Which paragraph", "questions": [[43, "gives examples of high-fibre foods?"], [44, "focuses on avoiding disease?"], [45, "explains how to live a healthier lifestyle?"], [46, "presents the risks to your body if you don't treat a certain symptom?"], [47, "lists nutritional substances found in plant-based diets?"], [48, "refers to expert opinions?"], [49, "mentions the importance of a healthy immune system?"], [50, "states that fibre affects how much we eat?"], [51, "includes a measurement?"], [52, "presents a downside of plant-based diets?"]]}]},
    {"id": "t6", "title": "Test 6", "parts": [{"id": "p1", "label": "Part 1", "name": "Multiple-choice cloze", "type": "cloze", "variant": "mc", "instr": "For questions 1–8, read the text below and decide which answer (A, B, C or D) best fits each gap. There is an example at the beginning (0).<br><b>Example:</b> (0) A for &nbsp; B as &nbsp; <b>C to</b> &nbsp; D with", "title": "How Persia became Iran", "paragraphs": ["In 1935, Persia officially changed its name {{0:to}} Iran. This decision was {{1}} by the Iranian government, who wanted to emphasise the country's cultural and national identity as {{2}} to its historical and geographic reference. The term 'Iran' comes {{3}} the Persian word 'Iran', which means 'Land of the Aryans'. The government believed that this new name would {{4}} reflect the country's ancient heritage and its modern aspirations.", "The change in name was also {{5}} of a larger effort to make Iran more modern and similar to western countries, an aim {{6}} included reforms in education, industry and social norms. The Iranian government {{7}} that this move would help to strengthen the country's international reputation and attract more investment and trade.", "However, the name change was not universally accepted. Some Iranians preferred to use the older name, Persia, which they felt had a stronger cultural and historical association. Nevertheless, the name 'Iran' has {{8}} the official name of the country to this day."], "choices": {"1": ["made", "done", "got", "had"], "2": ["opposite", "opposed", "different", "not"], "3": ["from", "with", "around", "as"], "4": ["worst", "best", "well", "better"], "5": ["member", "partially", "part", "due"], "6": ["what", "has", "which", "where"], "7": ["wanted", "hoped", "wished", "needed"], "8": ["continued", "kept", "become", "remained"]}}, {"id": "p2", "label": "Part 2", "name": "Open cloze", "type": "cloze", "variant": "open", "instr": "For questions 9–16, read the text below and think of the word which best fits each gap. Use only <strong>one</strong> word in each gap. There is an example at the beginning (0).", "title": "How do aeroplanes fly?", "paragraphs": ["Have you ever wondered {{0:WHAT}} makes aeroplanes fly? Basically, there are four fundamental forces acting on {{9}}; lift, weight, thrust and drag. Lift is the force that holds an aeroplane in the air. As the aeroplane moves {{10}} the air, the shape of the wings creates a difference in air pressure {{11}} the upper and lower surfaces, resulting in upward lift.", "Weight is the downward acting force of gravity and is opposed {{12}} lift. To remain in flight, an aeroplane must generate enough lift {{13}} equal its weight. Thrust is the force that propels the aeroplane forward and {{14}} generated by the engines. It overcomes drag, which is the force that opposes the aeroplane's forward motion and is caused by the friction of the air {{15}} its surfaces.", "Together, these forces enable an aeroplane to take off, climb, cruise, descend and land. Pilots use a combination {{16}} control surfaces to manipulate these forces and control the aeroplane's movement safely and efficiently."]}, {"id": "p3", "label": "Part 3", "name": "Word formation", "type": "cloze", "variant": "wordform", "instr": "For questions 17–24, read the text below. Use the word given in capitals at the end of some of the lines to form a word that fits in the gap <strong>in the same line</strong>. There is an example at the beginning (0).", "title": "Ancient peoples who studied the moon", "paragraphs": ["A few ancient peoples studied the moon. The first {{0:KNOWN|KNOW}} lunar calendar was created by the ancient Babylonians around 2000 BCE. They suggested a {{17}} of the lunar month into four phases: the new moon, first quarter, full moon and last quarter.", "The Greeks also developed a lunar calendar. Although it was {{18}} defined, it was during this time that the names of the lunar phases were associated with the {{19}} Selene. The Romans later adopted these names, and they became {{20}} used throughout Europe.", "North American Indigenous peoples also developed their own names for the phases of the moon, based on local flora, fauna and {{21}} events. For example, the Ojibwe people of the Great Lakes region called the full moon in February the Snow Moon, while the Haida people of the Pacific Northwest {{22}} to the full moon in May as the Frog Moon. Today, the names of the lunar phases are still {{23}} used. This reminds us of our connection to the {{24}} world and the passage of time."], "stems": {"17": "DIVIDE", "18": "POOR", "19": "GOD", "20": "WIDE", "21": "SEASON", "22": "REFERENCE", "23": "COMMON", "24": "NATURE"}}, {"id": "p4", "label": "Part 4", "name": "Key word transformations", "type": "kwt", "instr": "For questions 25–30, complete the second sentence so that it has a similar meaning to the first sentence, using the word given. <strong>Do not change the word given.</strong> You must use between <strong>two</strong> and <strong>five</strong> words, including the word given.", "example": {"orig": "She's a very skilled girl, so she can do the job by herself.", "key": "SUCH", "pre": "She's", "ans": "SUCH A SKILLED GIRL THAT", "post": "she can do the job by herself."}, "items": [{"n": 25, "orig": "I started writing this essay a month ago.", "key": "SINCE", "pre": "It", "post": "I started writing this essay."}, {"n": 26, "orig": "Anna is the only friend that I invited to the wedding.", "key": "APART", "pre": "I didn't invite any friends to the wedding", "post": "Anna."}, {"n": 27, "orig": "We didn't want to leave the party as it was so much fun.", "key": "FEEL", "pre": "The party was so much fun that we", "post": "it."}, {"n": 28, "orig": "Are you familiar with this system yet?", "key": "USED", "pre": "Have you", "post": "this system yet?"}, {"n": 29, "orig": "None of the dancers could sing.", "key": "UNABLE", "pre": "All the dancers", "post": "sing."}, {"n": 30, "orig": "We do not need to ask anyone for directions.", "key": "NECESSARY", "pre": "It", "post": "us to ask anyone for directions."}]}, {"id": "p5", "label": "Part 5", "name": "Multiple choice", "type": "mc", "instr": "You are going to read a fable called <em>The Lion, the Fox and the Stag</em>. For questions 31–36, choose the answer (A, B, C or D) which you think fits best according to the text.", "passage": ["A Lion lay sick in his den, unable to provide himself with food. So he said to his friend the Fox, who came to ask how he was, 'My good friend, I wish you would go to the woods and request that the big Stag, who lives there, come to my den – I fancy turning a Stag's heart and brains into my dinner.'", "The Fox went to the wood and found the Stag and said to him, 'My dear sir, you're in luck. You know the Lion, our king? Well, he's at the point of death, and has decided that you will take over from him as the new king when he dies. I hope you won't forget that I was the first to bring you the good news. And now I must be going back to him; and, if you take my advice, you will come too and be with him when he passes away.'", "The Stag was very pleased that the Lion had chosen him, so followed the Fox to the Lion's den, suspecting nothing. As soon as he arrived inside the Lion's den, the Lion jumped on him. However, the Lion jumped poorly, and the Stag was able to get away with only a few cuts to his ears. He returned quickly to the safety of the woods. The Fox was extremely embarrassed and the Lion, too, was dreadfully disappointed, as he was getting very hungry in spite of his illness.", "Therefore, the Lion begged the Fox to have another try at getting the Stag to come to his den. 'It will be almost impossible this time,' said the Fox, 'but I will try.' So off he went to the woods a second time, and found the Stag resting and trying to recover from his frightening experience. As soon as he saw the Fox he cried, 'You cheat! Why did you try to persuade me to go to my death like that? Leave me alone or I will attack you with my horns!'", "But the Fox had no shame and would not back down. 'My dear Stag,' he said, 'I did not know you were such a coward! Surely you didn't think that the Lion wanted to hurt you? Why, he was only going to whisper some royal secrets into your ear when you ran away like a scared rabbit. I am afraid that he was a little disgusted by your behaviour. Now he is considering making the Wolf king instead, unless you come back at once and show him your courage. I promise you he will not hurt you, and I will be your faithful servant.'", "The Stag was foolish enough to be persuaded to return, and this time the Lion made no mistake. He overpowered him and began to eat the Stag's carcass eagerly. The Fox, meanwhile, waited for his chance and, when the Lion wasn't looking, took away the brains as a reward for his hard work. After a while, the Lion began looking for them, of course without success. The Fox, who was watching him, said, 'I don't think it is much use your looking for the brains – a creature who walked twice into a Lion's den can't have had any.'"], "source": "Adapted from The lion, the fox and the stag, from Aesop's Fables.", "questions": [{"n": 31, "q": "In the first paragraph, why does the Lion want to see the Stag?", "o": ["to explain that he is ill", "to eat him", "to talk to him", "to ask him for help"]}, {"n": 32, "q": "In the second paragraph, we can imply that the Fox is", "o": ["ambitious.", "loyal.", "kind.", "clever."]}, {"n": 33, "q": "After going into the Lion's den, the Stag", "o": ["was hurt but managed to escape.", "had his ears eaten by the Lion.", "hid itself behind the Fox.", "hurt the Lion, who couldn't jump anymore."]}, {"n": 34, "q": "In the fourth paragraph, the Stag", "o": ["begs the Fox for help.", "fights the Fox.", "threatens the Fox.", "is scared of the Fox."]}, {"n": 35, "q": "In order to convince the Stag to go to the Lion's den again, the Fox", "o": ["compares the Stag to the Wolf.", "says the Lion has made him the king.", "says the Stag misjudged the Lion's actions.", "promised to get the Stag a rabbit to eat."]}, {"n": 36, "q": "In the last paragraph, the Fox implies that the Stag was", "o": ["weak.", "cowardly.", "stupid.", "lazy."]}]}, {"id": "p6", "label": "Part 6", "name": "Gapped text", "type": "gapped", "instr": "You are going to read a magazine article for teenagers about screen time. Six sentences have been removed from the article. Choose from the sentences <strong>A–G</strong> the one which fits each gap (37–42). There is <strong>one extra sentence</strong> which you do not need to use.", "title": "Being aware of screen time", "subtitle": "We have spoken to specialists about this so-common subject, and this is what we thought you should know.", "options": {"A": "This is just one of the many questions most of the doctors who were interviewed have raised.", "B": "It is therefore essential to be aware of the impact that screen time can have on your eyesight, mental health and overall well-being.", "C": "This is an issue that can lead to a range of eyesight problems.", "D": "You can do this by setting a timer to remind you to take a break every hour or so and use this time to take a walk or just rest your eyes.", "E": "You can also use your phone, tablet and laptop to learn new skills, such as coding or graphic design, or rather things that can be useful in future careers.", "F": "Social media and other online platforms can put pressure on you to act or look a certain way.", "G": "However, too much screen time can be harmful, particularly for teenagers."}, "paragraphs": ["It can't be denied that screens are a huge part of our life nowadays. From smartphones to tablets and laptops, we use electronic devices to stay connected, learn and be entertained. {{37}} So today, we will explain why you should be aware of screen time and the potential problems associated with it.", "To begin with, let's talk about a concern most of the doctors we interviewed have mentioned: excessive screen time. {{38}} Besides causing headaches, staring at a screen for prolonged periods can cause dry eyes and blurred vision, as well as a condition known as digital eye strain. This happens because the blue light emitted by screens can cause damage to the eyes over time, especially in the long term. If left unchecked, these problems can lead to more severe issues such as myopia. Therefore, not only teenagers, but also children and adults must be aware of the impact that screen time can have on their eyesight, and then they must take steps to reduce it.", "Another concern presented by the medical doctors and researchers we have spoken to is that excessive screen time can lead to anxiety-related problems. {{39}} This can cause you to feel inadequate when you don't feel like you match those expectations. Moreover, excessive screen time can interfere with the sleep patterns of people at all ages, leading to further problems such as irritability and difficulty concentrating.", "So, what can you do to make screen time productive? Experts have given various suggestions, but we have compiled the ones we found most useful. Firstly, you can set limits on your screen time, especially when it comes to leisure activities, and use it mostly for essential tasks such as studying or communicating with family and friends. {{40}} Furthermore, you can use screens to stay informed about current events and global issues. This can help you develop critical thinking skills and become a more engaged citizen.", "Another way to make screen time productive is to use it for activities that demand creativity, such as writing and drawing. These activities can help you express yourself and develop your artistic abilities. Finally, it is essential to take regular breaks from screens. {{41}} You can also use this time to engage in mindful activities such as meditation or deep breathing exercises, which can help reduce stress and anxiety.", "To conclude, it is important to point out that screen time is, and will probably always be, an integral part of our daily lives, but excessive screen time can lead to a wide range of problems, particularly for young people. {{42}} This is the way by which you will be able to make the most of your screen time while also reducing the risks associated with it."]}, {"id": "p7", "label": "Part 7", "name": "Multiple matching", "type": "matching", "instr": "You are going to read about how four teenagers practise self-care. For questions 43–52, choose from the four people (<strong>A–D</strong>). The people may be chosen more than once.", "title": "Practising self-care", "subtitle": "Young people talk about how they take care of themselves.", "people": [{"l": "A", "name": "", "text": "Self-care isn't something that was on my radar. In fact, I'd never even heard of it until I went to the doctor's a few weeks ago. I'd been feeling exhausted all the time and just didn't have any energy to do anything. Even the things that I used to love, like going mountain biking, didn't bring me any joy, and I couldn't even be bothered to do them. I was told that I was probably suffering from burnout after I'd spent a few months concentrating only on passing my final exams so I could get into my dream university. I thought I needed some medication, but all the doctor gave me was advice. Since then, I've tried to take it easy and not worry too much about the future. I'm feeling much more relaxed, it's easier to make plans and, fortunately, being back in the mountains on my bike is putting a big smile on my face again."}, {"l": "B", "name": "", "text": "Since I was in a car crash two years ago, self-care has been a significant part of my life. I spent several months in hospital, which taught me that you need to listen to your body and take care of it. I try to make time for myself every day, even if it's just for a few minutes. I love to draw and paint, and it helps me express my emotions. I also love to sit by my bedroom window and listen to music. It helps me clear my head and feel better. I make sure to eat healthy food, and I always stay hydrated since that helps me concentrate and stops me getting headaches. Finally, I try to get enough sleep and stay away from social media when I feel overwhelmed. Self-care is essential, and I make sure I take care of myself every day."}, {"l": "C", "name": "", "text": "I love to dance. When I'm dancing, I feel completely free. I used to think that it was just something fun to do, but since I started my final year at school, it's become a lot more than that. Dancing helps me forget about things that have gone annoyed me during the day and I feel happier and more relaxed at the end of the session, especially if I've worked up a sweat! I guess it's a form of self-care. I've made some good friends at the dance studio. Since none of them go to my school, I can talk to them freely about problems at school or difficulties that I'm having. They can give me a neutral opinion, which I find helpful. I listen to their problems too, and it feels good to help each other. We always joke that our regular visits to the juice bar are our therapy sessions!"}, {"l": "D", "name": "", "text": "I've kept a journal for years, but over the past year or so it's become more important to me. After I got frustrated and burst into tears at a family dinner because I was so stressed about my studies, my aunt, who's a psychology teacher, suggested that I keep a mood journal. Every day, I write about things that make me angry, stressed, happy and what I did to improve my mood. I can look back at it and recognise different situations that affect my mood. It's been really helpful as I can notice when I need to take some time out for myself. I've picked up meditation recently. It was a bit tricky to get into at first, but now I find it easier to switch off. I usually go to the end of the garden. There's a little bench there in the shade so nobody bothers me."}], "lead": "Which person", "questions": [[43, "implies that being offline helps their mood?"], [44, "hadn't made time for anything other than studying?"], [45, "uses writing to track their feelings?"], [46, "is grateful they can enjoy their hobbies?"], [47, "says that self-care helps them feel less stressed?"], [48, "asked a medical professional for help?"], [49, "explains the benefits of being active?"], [50, "suffered serious injuries?"], [51, "talks about the importance of drinking water?"], [52, "prefers relaxing outside?"]]}]},
    {"id": "t7", "title": "Test 7", "parts": [{"id": "p1", "label": "Part 1", "name": "Multiple-choice cloze", "type": "cloze", "variant": "mc", "instr": "For questions 1–8, read the text below and decide which answer (A, B, C or D) best fits each gap. There is an example at the beginning (0).<br><b>Example:</b> (0) A great &nbsp; B best &nbsp; <b>C most</b> &nbsp; D more", "title": "The reign of Queen Elizabeth II", "paragraphs": ["Queen Elizabeth II was one of the {{0:most}} inspiring monarchs in English history. She ascended {{1}} the throne in 1952 and was queen for 70 years, until her {{2}} in 2022. She witnessed a number of cultural, economic and socio-political transformations in England as {{3}} as its role in the world. She was dedicated to her duties and to public service and she showed incredible resilience, even in the face of personal and national challenges.", "Under her leadership, England experienced many significant events, {{4}} the decolonisation of the British Empire, the {{5}} of the Commonwealth of Nations and the growth of a multicultural society. The Queen also played a vital {{6}} in promoting international relations, hosting numerous visits from foreign dignitaries and heads of state and serving as a global representative of the United Kingdom.", "Her time as queen also saw significant changes in what the monarchy represented to the country and the world. {{7}} these, there is the reduction of her powers and the increase in being transparent, that is, showing how public money is spent on the royal family. Her long period on the throne made her a symbol of continuity, and her {{8}} on English history is impossible to deny."], "choices": {"1": ["with", "over", "to", "for"], "2": ["died", "death", "killing", "dying"], "3": ["many", "good", "well", "much"], "4": ["including", "such", "since", "adding"], "5": ["arise", "upbringing", "raise", "rise"], "6": ["part", "role", "leadership", "difference"], "7": ["Between", "With", "Around", "Among"], "8": ["impact", "affect", "differences", "change"]}}, {"id": "p2", "label": "Part 2", "name": "Open cloze", "type": "cloze", "variant": "open", "instr": "For questions 9–16, read the text below and think of the word which best fits each gap. Use only <strong>one</strong> word in each gap. There is an example at the beginning (0).", "title": "The round shape of bubbles", "paragraphs": ["Bubbles are round in shape due {{0:TO}} a fundamental property of the substance that forms them. When a bubble is formed, it encloses a gas {{9}} a mixture of gases that are less dense than the surrounding liquid. The surface tension of the liquid then acts to minimise the surface area of the bubble, {{10}} results in a spherical shape. This is because a sphere has the smallest surface area for a given volume, which is {{11}} most stable shape for the bubble.", "The roundness of bubbles can also be observed in other situations {{12}} a liquid is exposed to air, such as droplets or foam. In each case, the surface tension of the liquid pulls the liquid molecules towards each other, resulting {{13}} the smallest possible surface area for the volume of liquid.", "This phenomenon is known {{14}} the minimum surface area principle. However, not all bubbles are spherical, only the ones that float through the air. So, if you {{15}} buy a bottle of soap solution and a 'wand', test it by blowing through the round part of the wand to make round, beautiful bubbles. {{16}} matter how large the bottle and wand are, you will see that it will always form a bubble with a spherical shape as it floats freely through air."]}, {"id": "p3", "label": "Part 3", "name": "Word formation", "type": "cloze", "variant": "wordform", "instr": "For questions 17–24, read the text below. Use the word given in capitals at the end of some of the lines to form a word that fits in the gap <strong>in the same line</strong>. There is an example at the beginning (0).", "title": "Amsterdam Light Festival", "paragraphs": ["Amsterdam Light Festival is an event that takes place {{0:ANNUALLY|ANNUAL}} in the city during the winter months. The festival is a {{17}} of light, art and architecture. This is when the city is transformed into a wonderland of {{18}} sculptures and light projections.", "During the festival, the city's canals and streets become an open-air museum, with light artworks created by both {{19}} and local artists. The artworks are placed {{20}} around the city, allowing visitors to take a walking or boat tour to admire the works of art.", "The festival is not just about the art; it also celebrates Amsterdam's culture and {{21}} achievements. The artworks often reflect the city's heritage, and the festival includes music {{22}}, workshops and even lectures about the art and the city.", "The festival {{23}} visitors from all over the world, and it's easy to understand why. Amsterdam's Light Festival is a {{24}} experience that combines art, culture and history creating an atmosphere of entertainment in the heart of the city."], "stems": {"17": "CELEBRATE", "18": "ILLUMINATE", "19": "NATION", "20": "STRATEGY", "21": "HISTORY", "22": "PERFORM", "23": "ATTRACTION", "24": "BREATH"}}, {"id": "p4", "label": "Part 4", "name": "Key word transformations", "type": "kwt", "instr": "For questions 25–30, complete the second sentence so that it has a similar meaning to the first sentence, using the word given. <strong>Do not change the word given.</strong> You must use between <strong>two</strong> and <strong>five</strong> words, including the word given.", "example": {"orig": "He lost the match because he wasn't as well prepared as his opponent.", "key": "BETTER", "pre": "His opponent", "ans": "WAS BETTER PREPARED THAN", "post": "him."}, "items": [{"n": 25, "orig": "Mike didn't come to the opening party of the shop.", "key": "SHOW", "pre": "Mike", "post": "the opening party of the shop."}, {"n": 26, "orig": "It's been three days since I last saw Beatrice.", "key": "SEEN", "pre": "I", "post": "in three days."}, {"n": 27, "orig": "The only reason why I came was because Theo invited me.", "key": "HAVE", "pre": "I", "post": "if Theo hadn't invited me."}, {"n": 28, "orig": "I'm interested in learning more about the cosmos.", "key": "LIKE", "pre": "I", "post": "more about the cosmos."}, {"n": 29, "orig": "The receptionist didn't explain to us why the room wasn't available.", "key": "REASON", "pre": "The receptionist didn't", "post": "why the room wasn't available."}, {"n": 30, "orig": "I prefer staying in to going out with friends.", "key": "RATHER", "pre": "I", "post": "go out with friends."}]}, {"id": "p5", "label": "Part 5", "name": "Multiple choice", "type": "mc", "instr": "You are going to read an article from an American website about road trips for friends and families. For questions 31–36, choose the answer (A, B, C or D) which you think fits best according to the text.", "passage": ["Road trips are a classic adventure for people from all over the world, and teenagers especially enjoy the chance to hit the open road with their friends when they graduate school or college. Whether it's a weekend getaway or a longer journey, road trips offer a great opportunity to explore new places and bond with those closest to us. However, it's important to plan ahead and take necessary precautions to ensure a safe and enjoyable trip. In this article, we will tell you what you should know – and want to know!", "When planning a trip with friends, it is essential to choose destinations that are appealing to everyone in the group. This could be a national park, a beach, a big city, another country or state that is quite close to yours, among others. It is also important to consider the group's budget, and check that the trip is affordable for everyone.", "Road trips with family can be just as fun as those with friends, but they require a different approach. Family road trips often involve younger siblings or grandparents, so it's important to choose destinations that are family-friendly and accommodate all ages. Apart from the options given in the previous paragraph, you may also want to go to theme parks and historic landmarks, among other great options.", "When it comes to safety, you should remember that it comes first, so it is crucial to always wear seatbelts and avoid any careless driving behaviour. A plan for rest stops and for meals is also essential for a successful road trip. Taking a first aid kit along with you in case of any injuries or accidents is also advisable, especially if anyone in your family or among your friends tends to feel nauseated on long car trips. And do not forget to take snacks and drinks, especially water, to prevent unnecessary stops. Moreover, before hitting the road, you need to ensure that the car is in good condition and has been recently serviced. This can prevent any mechanical issues from arising during the trip.", "Spending hours in a car can be tedious, but there are plenty of ways to make time fly by. Playing games such as 'I Spy', '20 Questions' or 'Would you rather…' can be entertaining for all families and people of all ages. Listening to music, podcasts or audiobooks are also considered a great way to pass the time. Furthermore, taking breaks is essential on any road trip, not only to stretch your legs but also to explore roadside attractions. This is a way of breaking up the monotony of a long drive, particularly for the person behind the wheel. Visiting a local museum or checking out a unique landmark can also add some excitement to the journey.", "Finally, anyone on a road trip must be aware of the laws and regulations in the states or countries they are visiting or passing through. For example, in the US, some states have stricter driving laws than others, you must always follow the rules of the road. Moreover, avoiding any reckless driving behaviour or distractions like texting or using a phone is recommended to prevent accidents and ensure a safe trip. So with a little bit of preparation and a positive attitude, a road trip can be the adventure of a lifetime."], "questions": [{"n": 31, "q": "What does the first paragraph suggest about road trips?", "o": ["They are only for young people.", "They have been popular for a long time.", "They are short trips.", "They are a new trend."]}, {"n": 32, "q": "In the second paragraph, what important advice is given?", "o": ["Make sure that all the travellers can pay for it.", "Have an initial budget for your own expenses.", "Choose cheap destinations.", "Have a varied itinerary."]}, {"n": 33, "q": "One of the differences between travelling with friends and family is that", "o": ["with family, you need destinations that interest all ages.", "with friends, you need to take more money for accommodation.", "with friends, more snacks are needed.", "with friends, you can go to national parks and historic landmarks."]}, {"n": 34, "q": "What is implied in the fourth paragraph?", "o": ["Inappropriate driving behaviour is common among readers.", "The reader doesn't know first aid.", "The reader gets nauseous during car trips.", "The driver needs to be responsible during the road trip"]}, {"n": 35, "q": "In line 41 (paragraph 4: 'This can prevent any mechanical issues'), what does 'this' refer to?", "o": ["listening to music", "the road trip", "maintenance of the car", "a long drive"]}, {"n": 36, "q": "Why is the United States mentioned in the last paragraph?", "o": ["To provide examples of states and countries, mentioned previously.", "To provide examples of places you can choose to go to.", "To provide examples of differentiation in laws.", "To exemplify careless behaviours when driving."]}], "title": "Road trips with friends and family", "subtitle": "What to do, what not to do, how not to be bored and more!"}, {"id": "p6", "label": "Part 6", "name": "Gapped text", "type": "gapped", "instr": "You are going to read an extract from a magazine article on how to manage your time better. Six sentences have been removed from the article. Choose from the sentences <strong>A–G</strong> the one which fits each gap (37–42). There is <strong>one extra sentence</strong> which you do not need to use.", "title": "How to manage your time better", "subtitle": "The complete guide for teenagers who are looking to make the most of their time", "options": {"A": "Instead of mindlessly browsing the internet, use your free time to work towards your goals.", "B": "However, with some planning and discipline, you can make the most of your time and achieve your goals.", "C": "When you are well-rested, you will be more alert, focused and productive throughout the day.", "D": "Resting, on the other hand, can bring you the benefits that this routine will have taken away from you.", "E": "That means that you should set goals for yourself, whether it is getting good grades, improving in a sport or hobby or simply spending more time reading your favourite novels.", "F": "This is the reason why learning to say no is an important part of managing your time effectively.", "G": "Once you have your objectives and primary activities in place, you should create a schedule that allows you to work towards them."}, "paragraphs": ["Managing your time effectively can be a challenging task during your teen years. Between school, extracurricular activities, socialising with friends and family, and also general chores, it can be tough to make time in the day to accomplish everything you want to do. {{37}} In this article, we'll discuss some tips to do exactly that.", "First of all, before you can manage your time effectively, you need to know what you want to achieve. {{38}} Once you have identified your goals, make sure to prioritise them in order of importance. This will help you focus your time and energy on the things that matter most to you.", "{{39}} Use a planner or calendar to block out time to do schoolwork, personal activities, sports and extracurricular classes. Make sure to leave some free time for socialising with friends and for relaxation, but make sure you do not overbook yourself. A schedule will assist you with that, besides helping you stay organised and on track, and ensuring that you have enough time for everything you need to do.", "Use your time wisely and avoid distractions. When you have any free time, it might be tempting to spend it scrolling through social media or playing video games. While it is important to relax and unwind, make sure you are using your free time wisely. {{40}} This could mean reading a book about something you like, practising a skill you think you need to improve on or working on a personal project. Even just a few minutes of focused work each day can add up over time. Moreover, as you may know, distractions can be a major timewaster, so do your best to avoid them. Put your phone on silent or in another room while you are studying or working on a project. Limit your time on social media and other time-wasting websites by using website blockers or other apps. And if you are studying in a public space, consider using noise-cancelling headphones or finding a quieter location where you can focus.", "You may feel pressure to say yes to every social invitation that comes your way. {{41}} If an invitation or opportunity does not align with your goals and priorities, or if it simply does not fit into your schedule, do not be afraid to decline. Saying that you cannot make it to an event or simple gathering with friends can be difficult, but it will ultimately help you stay focused on what matters most to you.", "Take breaks and get enough sleep. It's important to take breaks throughout the day to recharge and refocus. When you are studying or working on a school project, take a five- or ten-minute break every hour or so to stretch, walk around or grab a bite to eat. This will help you stay alert and focused. You should also keep in mind that sleeping benefits overall health and well-being, and it is also important for managing your time effectively. {{42}} Aim to get at least seven or eight hours of sleep each night. All in all, what you should always do is prioritise whatever you consider most important and arrange your tasks to get to the end of the day feeling satisfied with everything you have been able to do. […]"]}, {"id": "p7", "label": "Part 7", "name": "Multiple matching", "type": "matching", "instr": "You are going to read about how four teenagers save money. For questions 43–52, choose from the four people (<strong>A–D</strong>). The people may be chosen more than once.", "title": "Saving money", "subtitle": "Four teenagers discuss their ideas on saving money.", "people": [{"l": "A", "name": "Maria", "text": "Last year, I was saving up for a new laptop when I came across a browser extension that is supposed to save you money. I downloaded it to my computer because I thought that it would suggest cheaper alternatives whenever I looked for a product. Unfortunately, it didn't work very well, and I had to search through lots of websites to find the best deal. I must have downloaded dozens of different apps that help you save money. None of them were very useful. In the end, I got myself a piggy bank. I put all my coins into in. Even though it takes a while for them to add up into a large amount, there's some satisfying about being able to count them and see how much you have."}, {"l": "B", "name": "Zack", "text": "Even though my part-time job pays me better than most of my friends', they often make more expensive purchases. Don't get me wrong, I enjoy shopping, but I'd rather go to outlets where you can get brand name clothes at a fraction of the retail price. It doesn't bother me if it's last year's trend because I usually wear jeans and T-shirts anyway! My weakness is electronics, and I love following the latest technology. However, I'm still quite controlled. I wait for a while because I know that the price of a new product always goes down after a few months. I sometimes check out online marketplaces. People with a lot more money than me often buy new gadgets straight away then sell them online when they get bored of them. That's my opportunity to get a bargain!"}, {"l": "C", "name": "Fernanda", "text": "My friends and I love eating out, but it can get expensive. One of our favourite tricks is going to a restaurant with unlimited refills of soft drinks. We only buy one between us which ends up saving us quite a lot of money. None of us work, so we rely on pocket money from our parents or doing odd jobs like babysitting for our neighbours. My friend Rachel has wealthy parents, so she gets the most pocket money out of all of us. Her mum works in the fashion industry, and she gets loads of free clothes. Every so often, we go over to Rachel's house, and she lets us take whatever we want. That's why my wardrobe is full of fashionable clothes that didn't cost me any money! I know I'm lucky to have such a generous friend."}, {"l": "D", "name": "Ethan", "text": "I have to have the latest new smartphone or tablet, but that's a pretty expensive habit. I got fed up with having to wait until I had enough money, so I started my own businesses. I sell handmade items like jewellery and accessories on online marketplaces. By creating my own products, I'm able to set my own prices and earn more profit than if I were to work in a fast-food restaurant or a shop like my friends. I also like to offer customised items for customers, which I charge extra for. Those products are popular at Christmas, so I spend a lot of time on orders at that time. In addition to selling my own products, I also offer services like pet sitting and dog walking in my neighbourhood. These small jobs may not earn a lot individually, but they add up over time."}], "lead": "Which person", "questions": [[43, "spends less money than their friends?"], [44, "is usually busy at the end of the year?"], [45, "buys second-hand items?"], [46, "has tried to save money using the internet?"], [47, "makes money on the internet?"], [48, "shares things with their friends?"], [49, "spends a lot of money on technology?"], [50, "doesn't care about being fashionable?"], [51, "doesn't earn much money?"], [52, "saves money in a traditional way?"]]}]},
    {"id": "t8", "title": "Test 8", "parts": [{"id": "p1", "label": "Part 1", "name": "Multiple-choice cloze", "type": "cloze", "variant": "mc", "instr": "For questions 1–8, read the text below and decide which answer (A, B, C or D) best fits each gap. There is an example at the beginning (0).<br><b>Example:</b> (0) A many &nbsp; B variety &nbsp; <b>C lot</b> &nbsp; D number", "title": "Shooting stars", "paragraphs": ["Not a {{0:lot}} of people know this, but shooting stars only look like stars. In {{1}}, they are not really stars. The reason {{2}} they look so shiny is because they quickly shoot across the sky. A shooting star is really just a small {{3}} of rock or dust that comes from space and hits our planet's atmosphere. It moves {{4}} quickly that it heats up and shines just like a star. According to astronomers, these are not stars, but {{5}} meteors running through the atmosphere. It is the heat that is generated by the rock's entry into the atmosphere what causes the meteor to vaporise, producing a bright trail of light that we see as a shooting star.", "The best time to see shooting stars is {{6}} a meteor shower, a celestial event that occurs when Earth meets many meteoroids at once. It is more common to see shooting stars in the second half of July and in August. However, shooting stars can be seen {{7}} the year, and it's possible to catch a {{8}} of one on any clear night if you're lucky. The best time to look for shooting stars is before dawn, when the sky is really dark and so the chance of seeing a meteor is much higher."], "choices": {"1": ["reality", "true", "actuality", "fact"], "2": ["for", "which", "when", "why"], "3": ["part", "peace", "piece", "bit"], "4": ["so", "such", "too", "very"], "5": ["instead", "rather", "also", "like"], "6": ["while", "during", "when", "duration"], "7": ["throughout", "at", "around", "with"], "8": ["glance", "look", "glimpse", "watch"]}}, {"id": "p2", "label": "Part 2", "name": "Open cloze", "type": "cloze", "varia
