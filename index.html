<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 First – Practice Tests</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
:root{
  --ink:#1d3a52;--ink-muted:#557189;--ink-faint:#93abbd;
  --surface:#eef7fd;--card:#fff;--border:#cfe4f3;--border-soft:#e3f0f9;
  --accent:#2b8fd1;--accent-strong:#16679e;--accent-soft:#dbeffc;--accent-tint:#f3faff;
  --mark:#fff0b8;--mark-ink:#7a5200;--mark-border:#f5d76e;
  --peach:#ffe6d8;--peach-ink:#a4471b;
  --ok:#1f7a4d;--ok-bg:#e3f7ec;--ok-border:#9fdcbb;
  --err:#c23a4b;--err-bg:#ffecef;--err-border:#f5b5bf;
  --warn:#7a5200;--warn-bg:#fff8e1;--warn-border:#f5d76e;
  --shadow:0 2px 10px rgba(43,143,209,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--surface);color:var(--ink);font-size:15.5px;line-height:1.6}
button{font-family:inherit}
:focus-visible{outline:3px solid #8cc8ef;outline-offset:2px}

/* Layout */
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#e2f2fd 0%,#f6fbff 55%,#fff 100%);border-right:1px solid var(--border);padding:20px 14px 30px}
.brand{font-weight:800;font-size:1.05rem;margin:0 6px 2px;color:var(--accent-strong)}
.brand-sub{font-size:.8rem;color:var(--ink-muted);margin:0 6px 16px}
.content{padding:26px 32px 0;max-width:1440px;width:100%}
.part.narrow{max-width:960px}
.menu-btn{display:none;position:fixed;top:10px;left:10px;z-index:30;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:.88rem;padding:8px 14px;border-radius:20px;box-shadow:0 3px 10px rgba(43,143,209,.35)}
.scrim{display:none}

/* Mode switch */
.seg{display:flex;background:#d3eafa;border-radius:12px;padding:4px;margin:0 4px}
.seg-btn{flex:1;border:none;background:none;padding:8px 6px;border-radius:9px;font-weight:700;font-size:.84rem;color:var(--ink-muted);cursor:pointer}
.seg-btn.active{background:#fff;color:var(--accent-strong);box-shadow:0 2px 6px rgba(43,143,209,.2)}
.mode-desc{font-size:.8rem;color:var(--ink-muted);margin:10px 6px 18px;line-height:1.5;background:#fff;border:1px dashed #b7dcf3;border-radius:10px;padding:8px 10px}

/* TOC */
.toc details{margin-bottom:8px}
.toc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:10px;font-weight:800;font-size:.95rem;color:var(--accent-strong)}
.toc summary::-webkit-details-marker{display:none}
.toc summary::before{content:"▸";font-size:.75rem;color:var(--accent);margin-right:6px;transition:transform .15s}
.toc details[open] summary::before{transform:rotate(90deg)}
.toc summary .t-title{flex:1}
.toc summary:hover{background:#fff}
.toc-link{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px 7px 26px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid transparent}
.toc-link small{display:block;color:var(--ink-muted);font-size:.76rem;font-weight:400}
.toc-link:hover{background:#fff}
.toc-link.active{background:#fff;border-color:#a9d6f3;color:var(--accent-strong);box-shadow:var(--shadow)}
.badge{font-size:.74rem;font-weight:800;padding:1px 9px;border-radius:12px;background:#e5f1fa;color:var(--ink-muted);white-space:nowrap}
.badge.done{background:var(--accent);color:#fff}

/* Section header */
.part[hidden]{display:none}
.crumb{font-size:.82rem;color:var(--accent-strong);font-weight:700;margin-bottom:2px}
.part h2{font-size:1.4rem;font-weight:800;margin-bottom:12px;color:var(--ink)}
.instr{font-size:.92rem;color:var(--ink);background:var(--accent-tint);border:1px solid #b9ddf4;border-left:5px solid var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:18px}
.instr::before{content:"📌 Yêu cầu";display:block;font-weight:800;font-size:.8rem;color:var(--accent-strong);margin-bottom:3px}
.instr strong,.instr b{background:var(--mark);color:var(--mark-ink);padding:0 4px;border-radius:4px;font-weight:800}
.instr em{font-style:italic;font-weight:700}
.card{background:var(--card);border:1px solid var(--border-soft);border-radius:14px;padding:16px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
.qn{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--accent);color:#fff;font-size:.78rem;font-weight:800;margin-right:9px;flex-shrink:0}

/* Results */
.results{display:none;background:linear-gradient(135deg,#e1f2fd,#fff);border:2px solid #8cc8ef;border-radius:16px;padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.results.show{display:block}
.results h3{font-size:1.05rem;font-weight:800;margin-bottom:6px;color:var(--accent-strong)}
.res-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:.92rem}
.res-row b{color:var(--accent-strong);font-weight:800}
.res-row.total{border-bottom:none;font-weight:800;font-size:1.1rem}
.res-row.total b{background:var(--accent);color:#fff;padding:2px 14px;border-radius:14px}

/* Key word transformations */
.example{background:#fff;border:1px dashed #9fd0f0;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:.9rem;color:var(--ink-muted)}
.example-ans{display:inline-block;background:var(--accent-soft);color:var(--accent-strong);font-weight:800;font-size:.82rem;padding:1px 10px;border-radius:6px;border:1px solid #a9d6f3}
.kwt-original{font-family:'Lora',serif;font-size:.98rem;display:flex;align-items:center;color:var(--ink)}
.kwt-key{display:inline-block;background:var(--mark);color:var(--mark-ink);border:2px solid var(--mark-border);font-weight:800;font-size:.95rem;letter-spacing:.08em;padding:2px 14px;border-radius:8px;margin:10px 0 4px 37px}
.kwt-key::before{content:"🔑 ";letter-spacing:0}
.kwt-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;font-size:.98rem;line-height:2.3;padding-left:37px}
.txt-in{border:none;border-bottom:2px solid #9fcbe9;padding:2px 8px;font:inherit;font-weight:700;font-size:.94rem;background:var(--accent-tint);border-radius:6px 6px 0 0;outline:none;color:var(--accent-strong);text-transform:uppercase}
.txt-in::placeholder{text-transform:none;color:var(--ink-faint);font-size:.82rem;font-weight:400}
.txt-in:focus{border-bottom-color:var(--accent);background:var(--accent-soft)}
.kwt-line .txt-in{min-width:220px;flex:0 1 300px}
.txt-in.ok{border-bottom-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.txt-in.err{border-bottom-color:var(--err);color:var(--err);background:var(--err-bg)}

/* Reading texts */
.passage{background:#fff;border:1px solid var(--border-soft);border-radius:12px;padding:18px 22px;margin-bottom:6px;font-family:'Lora',serif;font-size:.96rem;line-height:1.9;columns:2 360px;column-gap:28px}
.passage p{margin-bottom:10px}
.src{display:block;font-size:.78rem;color:var(--ink-faint);font-style:italic;margin-bottom:16px}
.text-title{text-align:center;font-size:1.1rem;font-weight:800;color:var(--accent-strong);margin-bottom:4px}
.text-sub{text-align:center;font-style:italic;font-size:.88rem;color:var(--ink-muted);margin-bottom:12px}

/* Options */
.q-title{font-size:.98rem;font-weight:700;display:flex;align-items:flex-start;margin-bottom:10px}
.q-title u{text-decoration:none;background:var(--peach);color:var(--peach-ink);padding:0 4px;border-radius:4px;font-weight:800;text-transform:uppercase}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:10px;cursor:pointer;border:2px solid transparent;background:none;text-align:left;font-size:inherit;color:inherit;width:100%}
.opt:hover:not([disabled]){background:var(--accent-tint);border-color:#b9ddf4}
.opt[disabled]{cursor:default}
.letter{width:26px;height:26px;border-radius:50%;border:2px solid #bcd9ee;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:var(--ink-muted);flex-shrink:0;margin-top:1px;background:#fff}
.opt-text{font-size:.94rem;color:var(--ink)}
.opt.chosen{background:var(--accent-soft);border-color:#8cc8ef}
.opt.chosen .letter{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.r-ok{background:var(--ok-bg);border-color:var(--ok-border)}
.opt.r-ok .letter{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.r-err{background:var(--err-bg);border-color:var(--err-border)}
.opt.r-err .letter{background:var(--err);border-color:var(--err);color:#fff}

/* Gapped text / cloze */
.bank{background:#fff;border:1px solid var(--border-soft);border-radius:12px;padding:12px 18px;margin-bottom:16px}
.bank-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:.92rem;align-items:flex-start}
.bank-row:last-child{border-bottom:none}
.bank-row b{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent-strong);font-weight:800;flex-shrink:0}
.article{background:#fff;border:1px solid var(--border-soft);border-radius:12px;padding:18px 22px;margin-bottom:12px;font-family:'Lora',serif;font-size:.96rem;line-height:2.15}
.article p{margin-bottom:12px}
.gap{display:inline-flex;align-items:center;gap:4px;font-family:'Nunito',sans-serif;vertical-align:middle}
.gap-n{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 5px;font-size:.74rem;font-weight:800;color:#fff;background:var(--accent);border-radius:11px}
.gap-sel{font:800 .86rem 'Nunito',sans-serif;color:var(--accent-strong);background:var(--accent-soft);border:none;border-bottom:2px solid var(--accent);padding:2px 6px;border-radius:6px 6px 0 0;cursor:pointer}
.gap-sel.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.gap-sel.err{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.gap .txt-in{width:140px;font-size:.88rem}
.gap .gap-sel{max-width:170px}
.stem{font-size:.76rem;font-weight:800;color:var(--peach-ink);background:var(--peach);padding:0 6px;border-radius:5px;letter-spacing:.04em}
.ex-ans{font-weight:800;color:var(--accent-strong);background:var(--accent-soft);border-bottom:2px solid var(--accent);padding:0 8px;border-radius:6px 6px 0 0;text-transform:uppercase;font-size:.86rem}

/* Matching */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:16px}
.person{background:#fff;border:1px solid var(--border-soft);border-radius:12px;padding:14px 18px;font-family:'Lora',serif;font-size:.94rem;line-height:1.85}
.person h4{font-family:'Nunito',sans-serif;font-size:.98rem;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px;color:var(--accent-strong)}
.person h4 span{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;font-size:.82rem}
.lead{display:inline-block;font-weight:800;margin-bottom:10px;background:var(--mark);color:var(--mark-ink);padding:2px 12px;border-radius:8px}
.lead::after{content:" …?"}
.mm-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mm-q{flex:1;min-width:220px;font-size:.95rem;font-weight:600}
.mm-opts{display:flex;gap:6px}
.mm-opts .opt{width:auto;padding:0;border:none}
.mm-opts .letter{width:36px;height:36px;font-size:.85rem}
.mm-opts .opt:hover:not([disabled]){background:none}
.mm-opts .opt:hover:not([disabled]) .letter{border-color:var(--accent);background:var(--accent-tint)}
.mm-opts .opt.chosen,.mm-opts .opt.r-ok,.mm-opts .opt.r-err{background:none;border:none}

/* Feedback */
.fb{display:none;font-size:.9rem;margin-top:10px;padding:10px 14px;border-radius:10px;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border);font-weight:700}
.fb.err{background:var(--err-bg);color:#8f2232;border:1px solid var(--err-border)}
.fb .ans{display:inline-block;font-weight:800;color:#fff;background:var(--ok);padding:0 10px;border-radius:8px;margin-left:2px}
.fb .hint{display:block;margin-top:8px;color:var(--ink);background:#fff;border-radius:8px;padding:8px 10px;border:1px solid #f8d3d9}
.fb .hint::before{content:"💡 Gợi ý: ";font-weight:800;color:var(--warn)}
.fb-list .fb{margin-top:8px}

/* Bottom bar */
.part-actions{position:sticky;bottom:0;margin:22px -32px 0;padding:12px 32px;background:rgba(238,247,253,.96);backdrop-filter:blur(6px);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;z-index:5}
.status{flex:1;min-width:200px;font-size:.92rem;color:var(--ink-muted);font-weight:600}
.status b{color:#fff;background:var(--accent);padding:1px 10px;border-radius:12px;font-size:.98rem}
.btn{border:none;padding:10px 20px;border-radius:22px;font-weight:800;font-size:.88rem;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(43,143,209,.35)}.btn-primary:hover{background:var(--accent-strong)}
.btn-ghost{background:#fff;color:var(--accent-strong);border:2px solid #8cc8ef}.btn-ghost:hover{background:var(--accent-tint)}
.btn-nav{background:#fff;color:var(--ink-muted);border:1px solid var(--border);padding:9px 14px}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
body.exam .only-practice,body.practice .only-exam{display:none}

/* Split view: Part 5–7 */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.split.pane-right{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.split-pane{position:sticky;top:14px;max-height:calc(100vh - 100px);overflow-y:auto;border:1px solid var(--border);border-radius:14px;background:#fff;overscroll-behavior:contain;box-shadow:var(--shadow)}
.pane-head{display:none}
.pane-body{padding:14px 16px}
.split-pane .passage{border:none;padding:0;columns:auto;margin-bottom:6px}
.split-pane .people{grid-template-columns:1fr;gap:10px;margin-bottom:0}
.split-pane .person{background:var(--accent-tint)}
.split-pane .bank{margin-bottom:0;border:none;padding:0;background:none}
.split-main .card:first-child{margin-top:0}
.pane-btn{display:none}
@media (max-width:1100px){
  .split,.split.pane-right{display:block}
  .split-pane{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:none;height:72vh;z-index:45;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .22s;box-shadow:0 -6px 24px rgba(29,58,82,.2);display:flex;flex-direction:column}
  .part.pane-open .split-pane{transform:none}
  .pane-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;color:var(--accent-strong)}
  .pane-close{border:none;background:var(--accent-soft);color:var(--accent-strong);border-radius:14px;padding:5px 12px;font-weight:800;font-size:.82rem;cursor:pointer}
  .pane-body{overflow-y:auto;flex:1}
  .pane-btn{display:block;position:fixed;right:14px;bottom:76px;z-index:44;border:none;background:var(--accent);color:#fff;font-weight:800;font-size:.88rem;padding:10px 16px;border-radius:22px;box-shadow:0 4px 12px rgba(43,143,209,.4);cursor:pointer}
  .part.pane-open .pane-btn{display:none}
}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 16px rgba(29,58,82,.15);background:#f3faff}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(29,58,82,.3);z-index:35}
  .menu-btn{display:block}
  .content{padding:58px 16px 0}
  .part-actions{margin:22px -16px 0;padding:10px 16px}
  .passage{columns:1}.people{grid-template-columns:1fr}
  .kwt-line,.kwt-key{padding-left:0;margin-left:0}
}

/* User, modal, toast */
.userbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin:0 4px 14px;font-size:.86rem}
.userbox .who{flex:1;min-width:0;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userbox .who small{display:block;font-weight:600;color:var(--ink-muted);font-size:.74rem}
.userbox button{border:none;background:var(--accent-soft);color:var(--accent-strong);font-weight:800;font-size:.76rem;border-radius:10px;padding:4px 10px;cursor:pointer}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 4px 14px}
.quick .hist-link{position:relative;flex-direction:column;align-items:flex-start;white-space:nowrap;justify-content:flex-start;gap:2px;padding:10px 10px!important;background:#fff;border:1px solid #b9ddf4!important;border-radius:12px;font-weight:800;font-size:.84rem;line-height:1.25;box-shadow:var(--shadow)}
.quick .hist-link small{font-weight:600;margin-top:2px}
.quick .hist-link:hover{background:var(--accent-tint)}
.quick .hist-link.active{background:var(--accent);border-color:var(--accent)!important;color:#fff}
.quick .hist-link.active small{color:#dbeffc}
.quick .q-ic{font-size:1.25rem;line-height:1}
.quick .badge{position:absolute;top:8px;right:8px}
.modal{position:fixed;inset:0;background:rgba(29,58,82,.35);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal[hidden]{display:none}
.modal-card{background:#fff;border-radius:18px;padding:22px 24px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(29,58,82,.25)}
.modal-card h3{font-size:1.2rem;font-weight:800;color:var(--accent-strong);margin-bottom:4px}
.modal-card p{font-size:.9rem;color:var(--ink-muted);margin-bottom:14px}
.modal-card label{display:block;font-weight:800;font-size:.86rem;margin-bottom:12px}
.modal-card label small{font-weight:400;color:var(--ink-muted)}
.modal-card input{display:block;width:100%;margin-top:4px;padding:9px 12px;border:2px solid var(--border);border-radius:10px;font:inherit;font-weight:600}
.modal-card input:focus{outline:none;border-color:var(--accent)}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-weight:700;font-size:.88rem;padding:10px 18px;border-radius:22px;box-shadow:0 6px 20px rgba(29,58,82,.3);transition:opacity .2s,transform .2s;z-index:70;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--err)}
.timer{font-weight:800;font-size:.86rem;color:var(--accent-strong);background:#fff;border:1px solid var(--border);border-radius:14px;padding:4px 10px;font-variant-numeric:tabular-nums}

/* History */
.hist{max-width:1200px}
.h-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:#fff;border:1px solid var(--border-soft);border-radius:14px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.h-toolbar label{display:flex;flex-direction:column;font-size:.76rem;font-weight:800;color:var(--ink-muted);gap:3px}
.h-toolbar select,.h-toolbar input{font:inherit;font-size:.88rem;font-weight:600;padding:7px 10px;border:2px solid var(--border);border-radius:10px;background:#fff;color:var(--ink);min-width:150px}
.h-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.h-stat{background:#fff;border:1px solid var(--border-soft);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow)}
.h-stat b{display:block;font-size:1.6rem;font-weight:800;color:var(--accent-strong);line-height:1.2}
.h-stat span{font-size:.82rem;color:var(--ink-muted);font-weight:700}
.h-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.h-card{background:#fff;border:1px solid var(--border-soft);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.h-card h3{font-size:1rem;font-weight:800;margin-bottom:10px;color:var(--ink)}
.h-card.alert{border:2px solid var(--err-border);background:linear-gradient(180deg,#fff5f6,#fff)}
.h-card.alert h3{color:#a32c3c}

.v-pending{font-size:.7rem;font-weight:800;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:0 6px}
#content .part ::selection{background:#ffe48a}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* =====================================================================
   NỘI DUNG SÁCH — thêm test mới vào mảng BOOK.tests
   Kiểu Part hỗ trợ:
     kwt      : Key word transformations (items: n, orig, key, pre, post)
     mc       : Đọc hiểu trắc nghiệm A–D (passage, questions: n, q, o[4])
     gapped   : Điền câu vào bài (options A–G, paragraphs có {{số câu}})
     matching : Nối người/đoạn A–D (people, questions: [n, text])
     cloze    : Điền vào bài; variant "mc" (choices[n] = 4 phương án),
                "open" (tự điền 1 từ), "wordform" (stems[n] = từ gốc)
   Đáp án nằm riêng trong KEYS (đã mã hóa), theo test id và số câu.
   ===================================================================== */
const BOOK = {
  title: "B2 First – Practice Tests",
  tests: [
    {
      id: "t1", title: "Test 1",
      parts: [
        {
          id: "p1", label: "Part 1", name: "Multiple-choice cloze", type: "cloze", variant: "mc",
          instr: "For questions 1–8, read the text below and decide which answer (A, B, C or D) best fits each gap. There is an example at the beginning (0).<br><b>Example:</b> (0) A in &nbsp; B on &nbsp; <b>C for</b> &nbsp; D of",
          title: "My favourite teacher",
          paragraphs: [
            "I can recall several teachers who had a gift {{0:for}} teaching, but my favourite teacher and the one who had a major impact {{1}} my life and career, was my Year 10 English teacher. Like many teenagers, I wasn't {{2}} of reading, mainly because I was unable {{3}} get my head around some of the complicated texts we read. I struggled and was {{4}} my peers when it came to my reading level. Because of that, I started to take a reinforcement class with Mr Brown, along with some other classmates. I remember {{5}} cosy and welcoming his classroom was, and how secure we all felt for being there.",
            "Mr Brown was a demanding teacher but also somebody we could {{6}} on. He taught interesting lessons that helped me comprehend complex concepts. His words of encouragement showed me that he had faith {{7}} me. I enjoyed the programme because it catered to my individual needs. I want to be like him and also make a difference in other people's lives someday. Yesterday, I met him in the hallway and {{8}} him know that I'm thinking of becoming a teacher one day. I asked him how hard it would be for me, and with a smile, he said it would be much more rewarding than troublesome."
          ],
          choices: {
            1: ["at", "about", "in", "on"],
            2: ["keen", "fond", "fan", "much"],
            3: ["at", "for", "of", "to"],
            4: ["behind", "ahead", "at", "after"],
            5: ["that", "when", "how", "much"],
            6: ["expect", "believe", "trust", "depend"],
            7: ["at", "for", "in", "on"],
            8: ["informed", "let", "made", "allowed"]
          }
        },
        {
          id: "p2", label: "Part 2", name: "Open cloze", type: "cloze", variant: "open",
          instr: "For questions 9–16, read the text below and think of the word which best fits each gap. Use only <strong>one</strong> word in each gap. There is an example at the beginning (0).",
          title: "FOMO and FOR: what are these fears?",
          paragraphs: [
            "Two conditions have been stressing people {{0:OUT}} lately. FOMO, the acronym formed from Fear Of Missing Out, is one of them. It is what we call a feeling of anxiety that arises when {{9}} feels like they are missing out on something. This condition is very often associated {{10}} social media and the fact that users are compelled to check social media the moment they wake up. This is because they feel the need to see {{11}} others are doing, and therefore, end up feeling as if they are not part of the action. It is believed that at least 60% of people experience FOMO {{12}} a regular basis.",
            "FOR, the acronym formed from Fear of Rejection, on the other hand, is the fear of being rejected or excluded {{13}} others. Both FOMO and FOR can lead to feelings of envy, insecurity, low self-esteem and even depression. It is important to remember that everyone {{14}} routine includes checking out on social media may experience FOMO {{15}} time to time, and it is important to take steps to manage it. Although it may also need psychological treatment, FOR is not as common {{16}} FOMO."
          ]
        },
        {
          id: "p3", label: "Part 3", name: "Word formation", type: "cloze", variant: "wordform",
          instr: "For questions 17–24, read the text below. Use the word given in capitals at the end of some of the lines to form a word that fits in the gap <strong>in the same line</strong>. There is an example at the beginning (0).",
          title: "Firefighters",
          paragraphs: [
            "Being a firefighter means having a lot of {{0:RESPONSIBILITY|RESPONSIBLE}}. Firefighters need to {{17}} to emergency calls, assess each situation, and take the necessary steps to extinguish the fire or save others. They work in a {{18}} of situations, all of which present some kind of danger to others. They are the ones to undertake searches and rescues. They also provide medical {{19}} to victims of fires and other emergencies.",
            "Firefighters must be {{20}} fit and able to think quickly and act decisively in {{21}} situations. They are also expected to be able to work as part of a team and follow orders from their superiors. Moreover, firefighters must have the necessary {{22}} of fire safety and prevention, and be able to educate the public about fire {{23}}. Becoming a firefighter has to do with being bold but also having an {{24}} of other people's needs and fears. Would you be up to such a job?"
          ],
          stems: { 17: "RESPONSE", 18: "VARY", 19: "ASSIST", 20: "PHYSICAL", 21: "DANGER", 22: "KNOW", 23: "SAFE", 24: "AWARE" }
        },
        {
          id: "p4", label: "Part 4", name: "Key word transformations", type: "kwt",
          instr: "Complete the second sentence so that it has a similar meaning to the first sentence, using the word given. <strong>Do not change the word given.</strong> You must use between <strong>two</strong> and <strong>five</strong> words, including the word given.",
          example: { orig: "Oliver has the talent to become a professional singer.", key: "THAT", pre: "Oliver is so", ans: "TALENTED THAT HE", post: "could become a professional singer." },
          items: [
            { n: 25, orig: "'I'm sorry for causing so much trouble,' Emma said.", key: "FOR", pre: "Emma", post: "caused so much trouble." },
            { n: 26, orig: "Jake received such nice messages when he was ill.", key: "WAS", pre: "Because of his illness, Jake", post: "really nice messages." },
            { n: 27, orig: "I didn't manage to help Marco with his task.", key: "IN", pre: "I didn't", post: "Marco with his task." },
            { n: 28, orig: "We've noticed there have been more dropouts this term.", key: "NUMBER", pre: "We've noticed a rise", post: "dropouts this term." },
            { n: 29, orig: "I'm sorry, but you must not take photos here.", key: "ALLOWED", pre: "I'm afraid taking photos", post: "." },
            { n: 30, orig: "I think she was afraid of raising a child in such a big city.", key: "UP", pre: "I think", post: "in such a big city caused her fear." }
          ]
        },
        {
          id: "p5", label: "Part 5", name: "Multiple choice", type: "mc",
          instr: "You are going to read an extract from the novel <em>The Wonderful Wizard of Oz</em>. For questions 31–36, choose the answer (A, B, C or D) which you think fits best according to the text.",
          passage: [
            "Dorothy lived in the middle of the great Kansas prairies, with Uncle Henry, who was a farmer, and Aunt Em, who was the farmer's wife. Their wooden house was small, for the material to build it had to be carried by wagon many miles. There were four walls, a floor and a roof, which made one room; and this room contained a rusty looking cookstove, a cupboard for the dishes, a table, three or four chairs, and the beds. Uncle Henry and Aunt Em had a big bed in one corner, and Dorothy a little bed in another corner. There was no attic at all, and no cellar — except a small hole dug in the ground, called a cyclone cellar, where the family could go in case one of those great whirlwinds or tornadoes arose, strong enough to destroy any building in its path. It was reached by a trap door in the middle of the floor, from which a ladder led down into the small, dark hole.",
            "When Dorothy stood in the doorway and looked around, she could see nothing but the great grey prairie on every side. Not a tree nor a house broke the broad sweep of flat country that reached to the edge of the sky in all directions. The sun had baked the ploughed land into a grey mass, with little cracks running through it. Even the grass was not green, for the sun had burned the tops of the long blades until they were the same grey colour to be seen everywhere. Once the house had been painted, but the sun destroyed the paint and the rains washed it away, and now the house was as dull and grey as everything else.",
            "When Aunt Em came there to live she was a young, pretty wife. The sun and wind had changed her, too. They had taken the sparkle from her eyes and left them a sober grey; they had taken the red from her cheeks and lips, and they were grey also. She was thin, and she never smiled now. When Dorothy, who was an orphan, first came to her, Aunt Em had been so startled by the child's laughter that she would scream and press her hand upon her heart whenever Dorothy's merry voice reached her ears; and she still looked at the little girl with wonder that she could find anything to laugh at.",
            "Uncle Henry never laughed. He worked hard from morning till night and did not know what joy was. He was grey also, from his long beard to his rough boots, and he looked serious and solemn, and rarely spoke. It was Toto that made Dorothy laugh, and saved her from growing as grey as her other surroundings. Toto was not grey; he was a little black dog, with long silky hair and small black eyes that twinkled merrily on either side of his funny, little nose. Toto played all day long, and Dorothy played with him, and loved him dearly.",
            "Today, however, they were not playing. Uncle Henry sat upon the doorstep and looked anxiously at the sky, which was even greyer than usual. Dorothy stood in the door with Toto in her arms, and looked at the sky too. Aunt Em was washing the dishes.",
            "From the far north they heard a low wail of the wind, and Uncle Henry and Dorothy could see where the long grass bowed in waves before the coming storm. There now came a sharp whistling in the air from the south, and as they turned their eyes that way, they saw ripples in the grass coming from that direction also."
          ],
          source: "Adapted from The Wonderful Wizard of Oz, by L. Frank Baum.",
          questions: [
            { n: 31, q: "In the first paragraph, what information can we find about Dorothy's house?", o: ["It was very small, with only four rooms.", "It was a single-room house made of wood.", "It was a small house made of straw.", "Its furniture was all rusty and the only bed had a hole in it."] },
            { n: 32, q: "What can we imply about the surroundings of Dorothy's house?", o: ["There weren't any neighbours around.", "It was a beautiful place with lots of grass and sunlight.", "It was a grey place without any happiness.", "The trees on the prairie were tall, but the houses were small."] },
            { n: 33, q: "What does the author suggest about Dorothy's aunt?", o: ["She seems to have aged little.", "She was even happier after Dorothy came to live with her.", "She's had a difficult life since she moved to Kansas.", "She was never surprised by other people's laughter."] },
            { n: 34, q: "In 'her other surroundings' (paragraph 4), 'other' refers to", o: ["everything and everyone else around her.", "the great prairies in Kansas.", "Uncle Henry.", "Uncle Henry and Aunt Em's belongings."] },
            { n: 35, q: "In the fifth paragraph, what is the author's purpose in showing the characters' anxiety?", o: ["to raise curiosity about the family relationship", "to exemplify the relationship between Dorothy and her uncle", "to demonstrate that days were not always the same there", "to show an important event for the plot"] },
            { n: 36, q: "What can we imply about the next events of the story?", o: ["Uncle Henry changes his behaviour eventually.", "Dorothy's dog Toto has a very important role in it.", "The characters' relationship is likely to improve.", "It involves an extreme weather condition."] }
          ]
        },
        {
          id: "p6", label: "Part 6", name: "Gapped text", type: "gapped",
          instr: "You are going to read a newspaper article about seaside resorts in England. Six sentences have been removed from the article. Choose from the sentences <strong>A–G</strong> the one which fits each gap (37–42). There is <strong>one extra sentence</strong> which you do not need to use.",
          title: "A British summer holiday",
          options: {
            A: "Besides, it is just a short stroll from the sandy bay of this place, which has been voted one of the best local beaches.",
            B: "Tens of thousands of tourists flock to the town year-round to ride the dodgems, take the ghost train or race around the large electric indoor go-karting track.",
            C: "This is one of the few beaches that allow dogs all year round, which means that even furry friends can come along in the summer.",
            D: "Its age shows in its dramatic coastline, and you can even visit a prehistoric cave with a fossil that is over 40,000 years old.",
            E: "Its mixture of green spaces, beach and town means that there's always something to keep you entertained.",
            F: "A trip to a seaside resort in England captures all the senses.",
            G: "Its family-friendly beaches provide hours of free entertainment."
          },
          paragraphs: [
            "Scratchy sand under your toes; brightly coloured beach huts hugging the beach front; shouts of happiness from children chasing each other across the beach and squawks of seagulls hunting scraps of food; the smell of salt wafting from the sea. {{37}} Building sandcastles, playing games at the seafront arcades, eating fish and chips as the sun goes down – a trip to the coast is a treat for both adults and children.",
            "The 400-year history of the English Riviera, along the Devon coast, makes it an interesting historic destination to discover. {{38}} The English Riviera is full of stories of pirates, smugglers and shipwrecks and, if you dare, an underground ghost tour.",
            "Although it has one of the largest naturally occurring beaches in the UK, Weston-super-Mare is better known for its iconic pier. {{39}} If you fancy something a little more sophisticated, you can sit and admire the views of the beach from the Edwardian-style tearoom, where a traditional British afternoon tea is served daily. Thin sandwiches with typical fillings such as tuna and cucumber, or smoked salmon are accompanied by miniature cakes and, of course, copious amounts of hot tea.",
            "Woolacombe Bay in North Devon is one of England's most popular holiday hotspots. {{40}} From climbing over rocks, to paddleboarding and swimming in the sea, from hunting crabs and eels in rockpools to catching the surf or taking lessons in how to ride the waves, there's something for everyone around the golden sand dunes of Woolacombe Bay. {{41}}",
            "For those who fancy going a little further afield, Shanklin is just a short ferry ride away in the Isle of Wight. Unlike many of England's beaches, which are covered in small smooth pebbles, Shanklin has a wide, sandy shore. After a day relaxing in a striped beach chair, you can stroll through the Old Village and visit one of the many shops, pubs and restaurants in Shanklin. {{42}}",
            "England may not conjure up images of a sun-soaked, idyllic paradise. Thanks to its unpredictable weather you never know if your trip to the seaside will leave you with sunburn or if it will be washed out by the rain. One thing's for certain – you'll never be bored."
          ]
        },
        {
          id: "p7", label: "Part 7", name: "Multiple matching", type: "matching",
          instr: "You are going to read a magazine article about four people who studied abroad. For questions 43–52, choose from the four people (<strong>A–D</strong>). The people may be chosen more than once.",
          title: "Studying abroad",
          subtitle: "Four young people talk about their experiences studying abroad.",
          people: [
            { l: "A", name: "Emma Baker", text: "After watching a presentation at school by a group of students who had just returned from an exchange programme in Egypt, I felt inspired to apply for it myself. As all the programmes were in English, there are many options to choose from. In the end, I chose to go to Berlin because it isn't too far from Wales, so I could hop on a plane home if I got homesick. Luckily, that wasn't a problem, and I didn't even want to come home at the end of my six-month stay! I was apprehensive before leaving, but Berlin felt like home right from the moment I stepped off the plane. I think that my host family was a big part of that – they went above and beyond to make me feel welcome and helped me sort out little things like getting a German SIM card, metro pass and even told me about the best places to go shopping. I would have been lost without them!" },
            { l: "B", name: "Ben Davies", text: "When you are studying abroad, it's funny how you miss things that you didn't even realise were important to you. I used to get ridiculously excited when hearing someone speak English with a strong Yorkshire accent – it made me feel so nostalgic. On my course, I met people from around the world and I learnt that, even though we have different backgrounds and beliefs, we all have the same capacity to be kind. Although a couple of people in my course had the same native language, everyone's common language was Italian. There were a lot of miscommunications since we were all still students, but they were easily overcome with lots of hand gestures and laughter; and the occasional online translation, of course." },
            { l: "C", name: "Caleb Smith", text: "Being far away from my family for eleven months was tough. Most of my classmates chose a college in Spain, but it has always been my dream to visit South America, so I applied for a programme in Buenos Aires. Unfortunately, I didn't take into account the distance or the cost of the flights. My mum was able to visit me for my birthday, and we spent a fabulous few days exploring the city, but nobody else was able to make the trip. Even though I was able to keep in regular contact with everyone back home, and I could 'join in' on celebrations through video calls, I still felt like I missed out on a lot of family moments. I would definitely study abroad again, but I'd probably choose somewhere closer to home." },
            { l: "D", name: "Laila Green", text: "People can have a low opinion about English cuisine, but my time abroad made me appreciate it so much. I found myself dreaming about classic British puddings, and I craved for things I hardly ever eat, like birthday cake! I struggled a bit with food on my study abroad programme as it was a little spicy for my taste. I should have packed some more snacks from home in my suitcase. Aside from the food, I only have positive things to say about my experience. It's completely normal to feel unsure in the beginning, but you should definitely take the chance. I'm certain that it will be the best thing you ever do!" }
          ],
          lead: "Which person",
          questions: [
            [43, "found the place that made them homesick unsurprising?"],
            [44, "had problems adapting to the local cuisine?"],
            [45, "wasn't looking forward to the end of their experience abroad?"],
            [46, "needed to resort to miming at times to communicate?"],
            [47, "spent a special date accompanied by someone from their home country?"],
            [48, "mentions how they felt when hearing a particular way of speaking?"],
            [49, "says they enjoyed the place from the very beginning?"],
            [50, "expresses their thanks towards someone from the place they visited?"],
            [51, "encourages the reader to try the same experience as them?"],
            [52, "showed concerns regarding the expenses of their experience?"]
          ]
        }
      ]
    },
    {"id": "t2", "title": "Test 2", "parts": [{"id": "p1", "label": "Part 1", "name": "Multiple-choice cloze", "type": "cloze", "variant": "mc", "instr": "For questions 1–8, read the text below and decide which answer (A, B, C or D) best fits each gap. There is an example at the beginning (0).<br><b>Example:</b> (0) A in &nbsp; B on &nbsp; <b>C for</b> &nbsp; D of", "title": "The benefits of a bedtime routine", "paragraphs": ["You might think that bedtime routines are only important {{0:for}} young children. However, they can be just {{1}} beneficial for teenagers. As teens go through significant physical and emotional changes, {{2}} a consistent bedtime routine can have a positive impact on their overall well-being. Teenagers need {{3}} eight to ten hours of sleep per night, but many struggle to get enough rest due to factors such as schoolwork, socialising and technology use. A consistent bedtime routine can help regulate their sleep patterns and make it easier for them to fall asleep and wake up at the same time each day. Getting enough sleep is crucial for academic performance as {{4}} and experts {{5}} that poor sleep habits affect memory, attention and concentration. Sleep also plays a vital role in regulating mood, and not {{6}} of sleep can lead to irritability, mood swings and other emotional challenges. A bedtime routine that includes relaxing activities can help teenagers unwind and promote feelings of calm and well-being. Relaxation techniques such as meditation or deep breathing can be used as part of a relaxing bedtime routine.", "{{7}} conclusion, a bedtime routine is an important aspect of teenage self-care that can have significant benefits for {{8}} physical and mental health. Establishing a consistent sleep schedule and engaging in relaxation techniques before bed can help you feel more rested, focused and emotionally balanced. Now, what about you? Are you getting enough quality sleep?"], "choices": {"1": ["too", "as", "so", "very"], "2": ["to take", "taking", "to follow", "following"], "3": ["around", "more", "at", "to"], "4": ["all", "also", "well", "we"], "5": ["ask", "present", "argue", "recommend"], "6": ["less", "lack", "enough", "sufficient"], "7": ["For", "In", "To", "As"], "8": ["also", "a", "either", "both"]}}, {"id": "p2", "label": "Part 2", "name": "Open cloze", "type": "cloze", "variant": "open", "instr": "For questions 9–16, read the text below and think of the word which best fits each gap. Use only <strong>one</strong> word in each gap. There is an example at the beginning (0).", "title": "What is a mirage?", "paragraphs": ["A mirage is an illusion that makes you think that you can see water, a phenomenon which can easily fool anyone who is feeling extremely thirsty, {{0:SUCH}} as those who are in a desert. These people tend to look ahead and see something that looks {{9}} the reflection of elements in a giant puddle of water. Mirages happen when light passes {{10}} two layers of air with different temperatures. The sun's light waves typically travel directly through the atmosphere to reach your eyes. However, {{11}} is known that the speed at {{12}} light moves varies in hot and cold air.", "Mirages occur when the air is chilly, {{13}} the ground, on the other hand, is very hot. The layer of air just above the ground gets heated by it, and as the light passes through this cold air and enters the hot air layer, it undergoes refraction. The light from the sky is refracted almost into a U shape by a layer of hot air that is close {{14}} the ground. A mirage happens because our brain perceives the light {{15}} having travelled in a straight line. It does not interpret the image as bent light from the sky. {{16}} of that, our brain concludes that the light came from something on the ground."]}, {"id": "p3", "label": "Part 3", "name": "Word formation", "type": "cloze", "variant": "wordform", "instr": "For questions 17–24, read the text below. Use the word given in capitals at the end of some of the lines to form a word that fits in the gap <strong>in the same line</strong>. There is an example at the beginning (0).", "title": "Food allergies and their dangers", "paragraphs": ["Some people have problems with gas, indigestion, among other {{0:IRRITABLE|IRRITATE}} bowel issues, but they don't always realise how their cause may be associated with {{17}} food allergies. The immune system can be affected by {{18}} allergens, which ends up causing inflammation.", "This affects a person's overall health and {{19}}, and they may suffer from stomach problems. Nutrient absorption may be {{20}} reduced by allergens, as your body doesn't always absorb the nutrients in the food you have consumed. Nourishing the body is key to healing and strengthening your digestive system. You are {{21}} to keep all the necessary nutrients unless your digestive system works {{22}}.", "Moreover, undigested food particles can leak across the intestinal wall, and enter your body. Your immune system usually reacts {{23}} to this. Your body, mainly your digestive system, becomes {{24}} and thinks that it is under attack."], "stems": {"17": "HIDE", "18": "KNOW", "19": "DIGEST", "20": "DRAMATIC", "21": "LIKE", "22": "PROPER", "23": "NEGATIVE", "24": "CONFUSE"}}, {"id": "p4", "label": "Part 4", "name": "Key word transformations", "type": "kwt", "instr": "For questions 25–30, complete the second sentence so that it has a similar meaning to the first sentence, using the word given. <strong>Do not change the word given.</strong> You must use between <strong>two</strong> and <strong>five</strong> words, including the word given.", "example": {"orig": "The children didn't listen to the teacher.", "key": "PAY", "pre": "The children", "ans": "DIDN'T PAY ATTENTION", "post": "to the teacher."}, "items": [{"n": 25, "orig": "The whole ecosystem may be negatively affected by plastic waste.", "key": "EFFECT", "pre": "Plastic waste may", "post": "the whole ecosystem."}, {"n": 26, "orig": "I didn't open the door because I didn't know it was Janet.", "key": "HAD", "pre": "If", "post": "Janet, I would have opened the door."}, {"n": 27, "orig": "The girl has been punished for vandalising the public bookstore.", "key": "BECAUSE", "pre": "The girl has been punished", "post": "the public bookstore."}, {"n": 28, "orig": "Lorries have been banned from the city centre.", "key": "BAN", "pre": "There has", "post": "lorries in the city centre."}, {"n": 29, "orig": "Valerie still went to school, despite not feeling very well.", "key": "ALTHOUGH", "pre": "Valerie still went to school,", "post": "very well."}, {"n": 30, "orig": "Eric's performance was so incredible that he was invited to join the orchestra.", "key": "SUCH", "pre": "Eric gave", "post": "that he was invited to join the orchestra."}]}, {"id": "p5", "label": "Part 5", "name": "Multiple choice", "type": "mc", "instr": "You are going to read an extract from the novel <em>Anne of Green Gables</em>. For questions 31–36, choose the answer (A, B, C or D) which you think fits best according to the text.", "passage": ["'I'm sorry I was late,' Matthew said shyly. 'Come on. The horse is over in the yard. Give me your bag.'", "'Oh, I can carry it,' the child responded cheerfully. 'It isn't heavy. I've got all my worldly goods in it, but it isn't heavy. It's an extremely old bag. Oh, I'm very glad you've come, even if it would have been nice to sleep in a wild cherry-tree. We've got to drive a long way, haven't we? Mrs Spencer said it was eight miles. I'm glad because I love driving. Oh, it seems so wonderful that I'm going to live with you and belong to you. I've never belonged to anybody – not really.'", "With this the child stopped talking, partly because she was out of breath and partly because they had reached the horse and carriage. She didn't say another word until they had left the village and were driving down a steep little hill.", "The child put out her hand and broke off a branch off a wild plum tree that brushed against the side of the buggy.", "'Isn't that beautiful? What did that tree, all white and lacy, make you think of?' she asked.", "'Well now, I dunno,' said Matthew.", "'A bride, of course! A bride all in white. I've never seen one, but I can imagine what she would look like. I don't ever expect to be a bride myself. But I do hope that someday I will have a white dress.", "I just love pretty clothes. And I've never had a pretty dress in my life that I can remember – but of course it's something to look forward to, isn't it? But these red roads are so funny. When we got into the train at Charlottetown and I saw all the red roads, I asked Mrs Spencer what made them red. She said she didn't know and not to ask her any more questions. She said I must have asked her a thousand already. I suppose I had, too, but how you going to find out about things if you don't ask questions? And what DOES make the roads red?'", "'Well now, I dunno,' said Matthew.", "'Well, that is one of the things to find out sometime. Isn't it incredible to think of all the things there are to find out about? It just makes me feel glad to be alive – it's such an interesting world. It wouldn't be so interesting if we know all about everything, would it? There'd be no room for imagination then, would there? But am I talking too much? People are always telling me I do. Would you rather not talk to me? If you say so I'll stop. I can STOP when I make up my mind to it, although it's difficult.'", "Matthew, much to his own surprise, was enjoying himself. He liked talkative people when they didn't expect him to reply. Although he found it rather difficult for his slower intelligence to keep up with this child's quick mental processes, he thought that he kind of liked listening to her. So he said as shyly as usual:", "'Oh, you can talk as much as you like. I don't mind.'"], "source": "Adapted from Anne of Green Gables, by L. M. Montgomery", "questions": [{"n": 31, "q": "What can we imply about Matthew from the first sentence?", "o": ["He isn't very confident.", "He prefers to be on time.", "He likes horse riding.", "He isn't very strong."]}, {"n": 32, "q": "What is meant by 'all my worldly goods' in line 4?", "o": ["all her ambitions", "everything she owns", "her books", "everything she's recently bought"]}, {"n": 33, "q": "What can be understood about the relationship between them?", "o": ["He's only met her once.", "He's her father.", "They are good friends.", "They don't know each other well."]}, {"n": 34, "q": "Based on the third paragraph, what word <u>couldn't</u> we use to describe the girl?", "o": ["talkative", "curious", "pessimistic", "bright"]}, {"n": 35, "q": "What is Matthew like?", "o": ["He's quiet and timid.", "He's talkative and outgoing.", "He's serious and rude.", "He's absent-minded."]}, {"n": 36, "q": "What does Matthew like about the girl?", "o": ["She's a good listener.", "She's shy but friendly.", "She's clever.", "She's very mature."]}]}, {"id": "p6", "label": "Part 6", "name": "Gapped text", "type": "gapped", "instr": "You are going to read a newspaper article about saving energy. Six sentences have been removed from the article. Choose from the sentences <strong>A–G</strong> the one which fits each gap (37–42). There is <strong>one extra sentence</strong> which you do not need to use.", "title": "Saving energy", "options": {"A": "If you can't do that, however, you will end up spending a lot more energy than you thought you would.", "B": "These are a little pricey, but they are worth the investment over the long term.", "C": "The higher the letter, the more energy efficient.", "D": "Losing money is an effective way to make something a habit!", "E": "It is a simple but powerful action that can have a significant impact on our planet.", "F": "The same applies to chargers.", "G": "So let's all do our part and take small steps to save energy every day."}, "paragraphs": ["Saving energy is everybody's responsibility. Reducing our energy consumption contributes to lowering harmful carbon emissions and protects the planet. {{37}} Political and social changes around the world mean that the cost of non-renewable energy such as gas is increasing. Keeping an eye on your energy consumption can avoid some nasty shocks when the bill arrives.", "With saving energy, lots of small actions can add up to make a big difference. For example, turn off lights and electronics when not in use. Try to get into the habit of turning off the lights when you leave the room. If you use a gaming computer but don't want to turn it off, turn off the monitor only. {{38}} Did you know that when they are plugged into a power socket they still use electricity, even without being connected to a device? Unplugging them when you finish using them can save a considerable amount of energy. These tips are more effective if the whole family are involved. Why not set up an 'electricity jar' in the kitchen or another common area? Every time someone forgets to turn off or unplug something, they must put some coins in the jar. {{39}}", "Sometimes turning off household appliances isn't a practical option, especially for essential items such as fridges. When the time comes to buy new appliances, look closely at the product information. Most countries have a classification system that outlines the energy efficiency of an appliance, and some of them use the alphabet for that. {{40}} If your family is thinking of upgrading their TV or washing machine, look for energy efficient options. Think of it in the same way as your school grades – an A is better than a D!", "If you live in a country with cold winters, your home probably has a heating system. Turning down the thermostat just a few degrees can save a lot of energy. To stay warm, wear warm clothing and use blankets instead of turning up the heat. Hot water bottles are a simple and cheap way to warm up your bed or to keep yourself warm when you're sitting on the sofa. Think about heating the person and not the space. Maintaining a warm temperature wastes a lot of energy. You can even buy warming blankets, pillows and jumpers, which are chargeable via USB. {{41}}", "Those in warmer climates are likely to be more concerned with staying cool. Using well-positioned fans instead of air conditioning can make a huge difference to the amount of energy you consume. If you can't live without air conditioning, there are still some ways that you can reduce the environmental impact. Window units consume almost three times less energy than portable units and central air conditioners. Programming your air conditioner to run on fan mode only will lower energy consumption even further.", "As a teenager, you can make a difference in the world by saving energy. If that isn't enough to convince you, consuming less energy can also have a positive impact on your wallet. {{42}}"]}, {"id": "p7", "label": "Part 7", "name": "Multiple matching", "type": "matching", "instr": "You are going to read about how four people try to consume responsibly. For questions 43–52, choose from the four people (<strong>A–D</strong>). The people may be chosen more than once.", "title": "How can you consume responsibly?", "subtitle": "Read how four people have changed their lives and habits to live a more sustainable life.", "people": [{"l": "A", "name": "Matthew", "text": "Whenever I leave the house, I always fill up my water bottle and take my own cutlery. The knife, fork and spoon are made of bamboo, and they have a special carry case that I can wrap up, so it fits easily into my backpack. Bamboo is a renewable resource because it is fast-growing and multiplies. I bought mine on a family trip to Bali, an island which takes sustainability very seriously. All the cafés serve drinks with metal or bamboo straws, and I saw many other travellers taking their own cutlery to restaurants or to the beach. My friends and I often grab a bite to eat at the food court or get takeaway food when we hang out, so by taking my own cutlery I can reduce the amount of waste I produce. It's only a small action, but it makes me feel good to know that I am a responsible consumer."}, {"l": "B", "name": "Natalie", "text": "I do my best to buy from sustainable and ethical brands. Some of my friends don't understand why I bother because it takes a lot of time to research brands and products to make sure they share my values. I don't want to support brands that don't pay their workers a decent wage or who use large amounts of natural resources to produce a simple garment, for example. I used to be a regular consumer of fast fashion. It was almost addictive – I could change my whole wardrobe every month for hardly any money. Once I even bought a dress for £2! I was telling my uncle about this, and he asked me how I thought that it was possible for the fashion company to sell clothes that cheaply. I hadn't ever asked myself that question, so I started to look into it. I was shocked by what I found and now I save up my money to buy something I know has been ethically made."}, {"l": "C", "name": "Leah", "text": "Several of my friends want to be influencers, so they buy a lot of clothes. They don't actually wear them though. Instead, they film themselves trying on the clothes and then they return them. I find that so wasteful! Unfortunately, lots of people have similar attitudes. We are so used to having things available to us for a low cost, that we don't appreciate it. The thing I hate the most is food waste. I accidently shouted at a friend once when she threw away a whole, unopened packet of grapes because she didn't fancy eating them. I was so shocked! I suppose that food is a sensitive topic for me because my family went through a really tough time when I was little. We didn't have a lot of money, and sometimes I could only have a hot meal at school. I know that there are millions of people who don't have enough to eat, so we shouldn't throw away good food."}, {"l": "D", "name": "David", "text": "My grandpa runs a hardware shop in town. It used to belong to my great-great grandpa, and one day my dad will take control. I'm not sure if I will work there full time myself, but I want to keep it in the family. Grandpa is extremely hardworking – he rarely has a day off and he's always there to open and close the shop. Everyone in our community knows him. He has a big heart, and he often gives people a discount or even goes round to help them with their DIY project! The trouble is, he can't keep up with the bigger hardware stores. They buy in huge quantities so they can sell at lower prices. Most small businesses have the same problem. They have higher prices, but their products are often made locally, which can reduce the carbon footprint of transportation. Small businesses like my grandpa's connect people in communities. He really inspires me. That's why I always choose to shop or eat at a local business rather than a big chain."}], "lead": "Which speaker", "questions": [[43, "has changed a habit?"], [44, "argues that small companies struggle to make money?"], [45, "works on their sustainable habit outside their home?"], [46, "is influenced by their past?"], [47, "looks up to someone?"], [48, "was encouraged to have more sustainable habits during a trip?"], [49, "explains why people are careless?"], [50, "criticises people around them?"], [51, "explains that they always choose to buy locally?"], [52, "used to buy a lot from mass-market retailers?"]]}]},
    {"id": "t3", "title": "Test 3", "parts": [{"id": "p1", "label": "Part 1", "name": "Multiple-choice cloze", "type": "cloze", "variant": "mc", "instr": "For questions 1–8, read the text below and decide which answer (A, B, C or D) best fits each gap. There is an example at the beginning (0).<br><b>Example:</b> (0) A said &nbsp; B named &nbsp; <b>C known</b> &nbsp; D called", "title": "The extinction of coral reefs", "paragraphs": ["Coral reefs are big limestone structures built by thousands of small coral creatures {{0:known}} as polyps. They are {{1}} to be among the most diverse ecosystems on the planet, providing a home to thousands of species of fish, marine mammals and invertebrates. However, they are in danger of extinction due {{2}} a variety of human-induced factors.", "Climate change is the main cause of their being endangered. It looks as {{3}} coral reefs are being cooked by warming oceans, and that is a huge red flag. Ocean acidification, {{4}} by absorbing carbon dioxide from the atmosphere, is also considered a {{5}} to coral reefs. Poor fishing practices, such as the use of cyanide and dynamite, also put the ecosystem's existence at risk. {{6}}, the fewer the fish, the more unbalanced the ecosystem is.", "The loss of coral reefs has negative consequences for both the environment and human populations. Coral reefs protect coastlines and the communities living {{7}} from the impact of big waves, storms and hurricanes. They also provide a source of food and income for a great part of the world population and are a major attraction for tourism. This is an extremely complex issue with numerous causes. We must {{8}} action to protect and preserve this critical ecosystem."], "choices": {"1": ["expected", "asked", "told", "said"], "2": ["to", "on", "of", "about"], "3": ["the", "probably", "though", "like"], "4": ["made", "harmed", "caused", "provided"], "5": ["injury", "threat", "damage", "endangered"], "6": ["Besides", "However", "Firstly", "Lastly"], "7": ["near", "nearby", "close", "approaching"], "8": ["get", "have", "make", "take"]}}, {"id": "p2", "label": "Part 2", "name": "Open cloze", "type": "cloze", "variant": "open", "instr": "For questions 9–16, read the text below and think of the word which best fits each gap. Use only <strong>one</strong> word in each gap. There is an example at the beginning (0).", "title": "The invention of the dishwasher", "paragraphs": ["The dishwasher, a household appliance that saves time and effort in cleaning dishes, {{0:WAS}} invented in the late 19th century. In 1886, Josephine Cochrane, a wealthy woman from Illinois, US, invented the first dishwasher. She was fed {{9}} with her servants breaking her fine china while washing it by hand. Cochrane's invention consisted {{10}} a wire rack that held dishes in place, which was placed inside a metal boiler. High-pressure water jets were used to clean the dishes, and finally, the dishes {{11}} rinsed with clean water.", "Her invention was a big hit. Hotels and restaurants were all interested {{12}} it, so she founded the Cochran's Crescent Washing Machine Company to manufacture and sell dishwashers. Back then, the dishwasher had a significant impact {{13}} society, especially for women. Before its invention, washing dishes was a time-consuming task that had to be done completely manually. The machine also helped to improve hygiene in the kitchen, as it {{14}} a more thorough cleaning possible.", "Today, the dishwasher has become an important part of households {{15}} the world. Modern dishwashers are energy-efficient and eco-friendly. They use less water and electricity to clean dishes. They are also more advanced, with features {{16}} as multiple wash cycles, adjustable racks and built-in sensors. Thanks to Cochrane's invention, people's housework became easier and quicker."]}, {"id": "p3", "label": "Part 3", "name": "Word formation", "type": "cloze", "variant": "wordform", "instr": "For questions 17–24, read the text below. Use the word given in capitals at the end of some of the lines to form a word that fits in the gap <strong>in the same line</strong>. There is an example at the beginning (0).", "title": "Understanding genetics", "paragraphs": ["The {{0:SCIENTIFIC|SCIENCE}} study of genes and heredity is called genetics. It involves the study of DNA, which carries the genetic information of an organism and is responsible for determining its {{17}} and sensitivity to disease. Genetics has proven to be {{18}} useful in medicine, agriculture and forensics. In medicine, it has been {{19}} used to identify the causes of inherited diseases, such as cystic fibrosis. This knowledge has led to new {{20}} to treat and cure diseases.", "Genetics has also been playing a {{21}} role in forensic science, as it is used to identify suspects in criminal investigations. DNA analysis has become a {{22}} tool in law enforcement, allowing investigators to link suspects to crime scenes and identify {{23}}.", "By unlocking the secrets of our DNA, genetics has helped us to understand ourselves and the world around is. It has also given us the tools to develop more {{24}} agricultural practices. As our understanding of genetics continues to grow, we can expect to see even more exciting uses in the future."], "stems": {"17": "CHARACTER", "18": "INCREDIBLE", "19": "WIDE", "20": "POSSIBLE", "21": "FUNDAMENT", "22": "POWER", "23": "CRIME", "24": "SUSTAIN"}}, {"id": "p4", "label": "Part 4", "name": "Key word transformations", "type": "kwt", "instr": "For questions 25–30, complete the second sentence so that it has a similar meaning to the first sentence, using the word given. <strong>Do not change the word given.</strong> You must use between <strong>two</strong> and <strong>five</strong> words, including the word given.", "example": {"orig": "Everyone agreed to meet in front of the clock.", "key": "IN", "pre": "We were all", "ans": "IN AGREEMENT ABOUT", "post": "meeting in front of the clock."}, "items": [{"n": 25, "orig": "Provided that you tell her the truth, you'll be fine.", "key": "LONG", "pre": "", "post": "tell her the truth, you'll be fine."}, {"n": 26, "orig": "We didn't need to ask your sister for help.", "key": "NECESSARY", "pre": "It", "post": "your sister for help."}, {"n": 27, "orig": "Emma was raised by her grandparents.", "key": "UP", "pre": "Emma", "post": "by her grandparents."}, {"n": 28, "orig": "I don't really want to go to the school games.", "key": "FORWARD", "pre": "I'm not really", "post": "the school games."}, {"n": 29, "orig": "We met while I was visiting California.", "key": "STAY", "pre": "We met", "post": "California."}, {"n": 30, "orig": "The only reason why I went to the concert was because I got a free ticket.", "key": "GONE", "pre": "If I hadn't got a free ticket, I", "post": "to the concert."}]}, {"id": "p5", "label": "Part 5", "name": "Multiple choice", "type": "mc", "instr": "You are going to read an extract from the novel <em>The Unexpected Guest</em> about the detective Hercule Poirot. For questions 31–36, choose the answer (A, B, C or D) which you think fits best according to the text.", "passage": ["I have met people who enjoy crossing the English channel; men who can sit calmly in their deck chairs and, on arrival, wait until the boat is moored, then gather their belongings together and leave the boat. Personally, I can never manage this. From the moment I get on board I feel that the time is too short to do anything. I move my suitcases from one spot to another, and if I go down to the restaurant for a meal, I eat my food quickly with an uneasy feeling that the boat may arrive unexpectedly while I am there. Perhaps all this is due to my short time in the war, when being among the first to disembark meant I didn't waste any minutes of my precious time off.", "On this particular July morning, as I stood by the rail and watched the white cliffs of Dover drawing nearer, I watched in wonder as my fellow passengers sat calmly in their chairs and never even looked up for the first sight of their native land. Yet perhaps their case was different from mine. They had probably only crossed to Paris for the weekend, whereas I had spent the last year and a half on a ranch in Argentina. I had done well there, and my wife and I had both enjoyed the free and easy life of the South American continent. Nevertheless, I felt emotional as I watched the familiar shore draw nearer and nearer.", "I had landed in France two days before, done some necessary business, and was now on my way to London. I imagined that I would be there several months – enough time to look up old friends, and one old friend in particular. A little man with an egg-shaped head and green eyes – Hercule Poirot! I intended to take him completely by surprise. My last letter from Argentina had given no hint of my voyage, which had been a last-minute decision caused by some unexpected business complications. I spent many amused moments picturing to myself his delight and amazement during our first meeting.", "I knew that he was not likely to be far from his headquarters. The time when his cases had taken him from one end of England to the other was past. He had become more and more famous, and no longer allowed one case to absorb all his time. He aimed more and more, as time went on, at being considered a 'consulting detective', a specialist. He hated the popular idea of a detective – someone who dressed in wonderful disguises to track criminals, and who paused at every footprint to measure it.", "'No, my friend Hastings,' he would say, 'we leave that to Giraud and his friends. Hercule Poirot's methods are his own. Order and method, and \"the little grey cells\". Sitting at ease in our own armchairs we see the things that these others overlook, and we do not jump to the conclusion like others.'"], "source": "Adapted from The unexpected guest, by Charles Osborne", "questions": [{"n": 31, "q": "In the first paragraph, what do we learn about Captain Hastings' personality?", "o": ["He's calm and shy.", "He enjoys sitting in his deck.", "He is a nervous person.", "He's always tired."]}, {"n": 32, "q": "In the second paragraph, what does Captain Hastings notice about the passengers?", "o": ["They were looking forward to landing.", "They wanted to spend more days in the sea.", "They didn't seem to miss their homeland.", "They really liked their homeland."]}, {"n": 33, "q": "What do we know about Captain Hastings' past?", "o": ["He spent many years in Argentina.", "He's been to another continent with his wife.", "He's from Dover.", "He met his wife in Argentina."]}, {"n": 34, "q": "What do we learn about the captain's relationship with Poirot?", "o": ["They've been friends for a long time.", "They've first met in Argentina.", "They had businesses to do together.", "They were siblings."]}, {"n": 35, "q": "In 'had taken him' in line 45, 'him' refers to", "o": ["Captain Hastings.", "Giraud.", "one of the passengers.", "Hercule Poirot."]}, {"n": 36, "q": "At the end of the extract, we learn that Poirot's methods", "o": ["were the same as other famous detectives.", "were unique.", "were famous.", "were copied from Giraud's."]}]}, {"id": "p6", "label": "Part 6", "name": "Gapped text", "type": "gapped", "instr": "You are going to read a newspaper article about soft skills in England. Six sentences have been removed from the article. Choose from the sentences <strong>A–G</strong> the one which fits each gap (37–42). There is <strong>one extra sentence</strong> which you do not need to use.", "title": "Why are soft skills important?", "options": {"A": "Additionally, it can make you a more effective problem-solver.", "B": "As a result, you are likely to become a more compassionate person.", "C": "Moreover, developing such skills can be very challenging for someone who doesn't have these two qualities.", "D": "Technological advances, such as artificial intelligence and deepfake, are making it easier to trick people into believing false information is true.", "E": "This could mean working with your classmates on a group project or participating in a team sport.", "F": "In summary, developing soft skills is an important part of being a well-rounded individual.", "G": "However, it's important not to overlook the importance of soft skills."}, "paragraphs": ["As a teenager, you're likely focused on developing hard skills – things like academic achievement or learning specific hobbies or interests. {{37}} These are the skills that enable you to effectively work with others and navigate the world around you. Let's take a look at some essential soft skills that teenagers should develop.", "Collaboration is all about working with others to achieve a common goal. {{38}} To be a good collaborator, you need excellent communication skills. That includes listening to other peoples' ideas with an open mind and being prepared to incorporate them. Good collaborations can make you a better team player, which can be an important asset in many areas of life, from sports to work to social situations. Additionally, it can help you build strong relationships with others, as you learn to appreciate the value of different perspectives and opinions.", "Critical thinking means being able to interpret information and make informed judgements. This skill has never been more important. {{39}} That's where critical thinking comes in – it involves questioning information and checking different sources to check the credibility of information. Critical thinking enables you to make well-informed decisions, rather than simply accepting things at face value. It can help you to make choices whether that's deciding on a university course, choosing a political candidate to support or simply evaluating which social media posts to believe. {{40}} This means that it helps you learn to break down complex issues and identify potential solutions.", "Empathising is the ability to understand and relate to other people's perspectives and experiences. This means being able to put yourself in someone else's shoes and understand their feelings and motivations. Empathy allows you to connect with others on a deeper level so you can build stronger relationships. {{41}} That means that you learn to appreciate the challenges and struggles that other people may face. Being able to empathise can be particularly useful in social situations because you can recognise and respond to others' emotions.", "{{42}} While hard skills are certainly important, soft skills like collaboration, critical thinking and empathising can make a significant difference in your ability to navigate the world around you. So whether you're working on a group project, doing online research for a school report, or simply hanging out with your friends, dedicate a little time to developing these important soft skills – you'll be glad you did!"]}, {"id": "p7", "label": "Part 7", "name": "Multiple matching", "type": "matching", "instr": "You are going to read a newspaper article about teen activists that four people admire. For questions 43–52, choose from the four people (<strong>A–D</strong>). The people may be chosen more than once.", "title": "Teen activists speak out", "subtitle": "Read the article to find out about who inspires our next generation to make a positive change.", "people": [{"l": "A", "name": "Hannah", "text": "The activist I most admire is Greta Thunberg. I doubt that there is anyone who hasn't heard of Greta! She has become a symbol of youth climate action worldwide, especially because of world leaders' reactions to her. Greta is very active on social media, and she isn't afraid to respond to people in positions of power to say what's on her mind. When she was 15, Greta started skipping school to protest outside the Swedish parliament, demanding action on climate change. Her actions sparked the global Fridays for Future movement, which saw students from around the world join her in striking from school to demand action on climate change. I wish I were one of them, but my mum is pretty strict, and she refused to let me join in when students at my school took part in strikes."}, {"l": "B", "name": "Thomas", "text": "I still remember the day when my teacher declared that we were going to make 'get well soon' cards for a girl called Malala. The teacher explained that Malala was from Pakistan, and she had been shot by terrorists. Her crime? Going to school and telling people that girls should have the right to study. My school was just around the corner from the hospital in Birmingham where Malala received her life-changing treatment. That night, I read all the blogs that Malala had been writing for the BBC about her experiences under Taliban rule in Pakistan. Since then, I've followed Malala's story closely and I'm always amazed by her resilience. Every year, I donate some of my birthday money to the Malala Fund, which is her charity that works to ensure every girl has access to 12 years of free, safe, quality education."}, {"l": "C", "name": "Sarah", "text": "Last year, I had to do a school project about original peoples around the world. I chose to research Indigenous communities in Canada, and that's where I first came across Autumn Peltier. Autumn comes from the Wiikwemkoong First Nation on Manitoulin Island in Ontario, Canada. At just 13 years old, Autumn became the chief water commissioner for the Anishinabek Nation, a role in which she advocates for clean water for Indigenous communities. Her work has brought attention to the urgent need to address the lack of access to clean water in many Indigenous communities in Canada and around the world. Many original peoples believe that we can't own the land. Instead, we are just here to protect it. Autumn's dedication to fighting to protect water resources and ensure access to clean water for all is impressive."}, {"l": "D", "name": "Nathan", "text": "A few years ago, I was lucky enough to attend a UN Youth Forum after I submitted an essa
