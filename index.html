nt": "open", "instr": "For questions 9–16, read the text below and think of the word which best fits each gap. Use only <strong>one</strong> word in each gap. There is an example at the beginning (0).", "title": "Our two sets of teeth", "paragraphs": ["Humans have two sets of teeth throughout their life. The first set, known {{0:AS}} the primary or deciduous teeth, act as a temporary set of teeth. These allow children to chew and learn {{9}} to speak properly. As a child's jaw and skull grow, their teeth become {{10}} small for the larger adult mouth, and they are gradually replaced by the permanent teeth.", "While this is true for humans, polyphyodonts on the {{11}} hand, are much more developed when it comes to teeth. This is {{12}} we call animals that can continuously produce teeth throughout their lifetime because their dental lamina remains active, {{13}} humans. This is the reason why humans stop producing teeth after the permanent set has fully developed, while animals such as sharks and alligators can continue to produce and replace teeth {{14}} needed. The dental lamina is a layer of cells in the mouth that generates tooth buds, {{15}} eventually develop into teeth. Once the permanent set of teeth is fully formed, the dental lamina in humans degrades, and this process cannot {{16}} reversed. In other words, once we lose an adult tooth, it will never grow back!"]}, {"id": "p3", "label": "Part 3", "name": "Word formation", "type": "cloze", "variant": "wordform", "instr": "For questions 17–24, read the text below. Use the word given in capitals at the end of some of the lines to form a word that fits in the gap <strong>in the same line</strong>. There is an example at the beginning (0).", "title": "Sir Isaac Newton", "paragraphs": ["Sir Isaac Newton (1642–1727) was an English {{0:MATHEMATICIAN|MATHEMATICS}}, physicist and astronomer who is {{17}} recognised as one of the {{18}} scientists in shaping how we understand the world. Newton made several significant {{19}} to science, the most important being his theory of universal gravitation.", "In 1687, Newton published the Mathematical Principles of Natural Philosophy, which {{20}} his theory of gravitation. His {{21}} was that every object in the universe is attracted to one another with a force that is proportional to the product of their masses and inversely proportional to the square of the distance between them. This theory provided a mathematical {{22}} for the motions of the planets in our solar system, as well as the tides in oceans.", "Newton's theory of gravitation revolutionised our understanding of the {{23}} world. It has been used to explain a wide range of phenomena, from the motion of bodies in space to the {{24}} of subatomic particles. Newton's ideas continue to inspire and inform our understanding of the world around us."], "stems": {"17": "WIDE", "18": "LEAD", "19": "CONTRIBUTE", "20": "DEFINITION", "21": "PROPOSE", "22": "EXPLAIN", "23": "PHYSICS", "24": "BEHAVE"}}, {"id": "p4", "label": "Part 4", "name": "Key word transformations", "type": "kwt", "instr": "For questions 25–30, complete the second sentence so that it has a similar meaning to the first sentence, using the word given. <strong>Do not change the word given.</strong> You must use between <strong>two</strong> and <strong>five</strong> words, including the word given.", "example": {"orig": "Sue's project was better presented than Neil's.", "key": "AS", "pre": "Neil's project was", "ans": "NOT AS WELL PRESENTED AS", "post": "Sue's."}, "items": [{"n": 25, "orig": "Ramirez succeeded in reaching the finish line in 48 seconds.", "key": "MANAGED", "pre": "Ramirez", "post": "the finish line in 48 seconds."}, {"n": 26, "orig": "We are really excited about travelling to the US.", "key": "LOOKING", "pre": "We", "post": "to the US."}, {"n": 27, "orig": "It is not worth buying a new set of tyres.", "key": "POINT", "pre": "There is", "post": "a new set of tyres."}, {"n": 28, "orig": "They weren't at home, so I didn't stay.", "key": "HAVE", "pre": "I", "post": "if they had been at home."}, {"n": 29, "orig": "The festival occurs every other year.", "key": "PLACE", "pre": "The festival", "post": "every other year."}, {"n": 30, "orig": "Jane's mum promised to take me to school.", "key": "LIFT", "pre": "Jane's mum promised to", "post": "to school."}]}, {"id": "p5", "label": "Part 5", "name": "Multiple choice", "type": "mc", "instr": "You are going to read an article about William Kamkwamba. For questions 31–36, choose the answer (A, B, C or D) which you think fits best according to the text.", "passage": ["William Kamkwamba, a Malawian inventor and author born in 1987, gained fame for constructing a windmill that generated electricity for his family's house in a rural region of Malawi. His autobiography, The Boy Who Harnessed the Wind, was published in 2009 by the New York Times. The book has been translated into nearly 20 languages and sold over a million copies. His story was also adapted into a film named after the book and produced by a multinational streaming company.", "Kamkwamba spent his childhood in the farming village of Masitala, located in the heart of Malawi, with his parents and six sisters. Their primary crop was corn, but financial difficulties were a big part of their reality. Over time, the family became poorer and poorer. In 2001, the whole nation faced a famine, resulting in the loss of their harvest and in their inability to buy or sell anything. As a result, Kamkwamba had to abandon his education since his family could not afford it any longer. Despite this setback, he continued to pursue the knowledge he was looking for at the local library, focusing mainly on science-related subjects, particularly physics.", "His interest in science came after discovering an English book called Using Energy, which presented wind power. This is how Kamkwamba discovered the concept of using wind power to generate electricity. He recognised that his village needed electricity and water since farming was suffering due to drought. He knew he needed to take action.", "Because Kamkwamba didn't have any materials to produce something to generate wind energy, he went to a scrap yard to see if he could find something to use. He then used old materials to create his first windmill, which powered four lamps and could recharge his neighbour's phone. He recalls that nobody believed his idea when he first went to the scrap yard. But afterwards, he claims that there were queues of people in front of their home waiting for him to help them charge their phones. Reporters started coming as well, and the young boy was invited to give a TED talk.", "Kamkwamba proceeded to construct three additional windmills all by himself, which provided the people in the village with enough electricity for night-time lighting and a solar-powered pump that could be used to irrigate their fields. Kamkwamba's knowledge and invention earned him a full scholarship to Dartmouth College's environmental studies programme in Hanover, USA, where he graduated in 2014. Although it was well-known that his invention was not completely innovative, he earned recognition for solving his village's issues and meeting their needs.", "After completing his studies, Kamkwamba decided it was time to get to work. He set up the Moving Windmills Project in 2008, which collaborates with the inhabitants of Kasungu, Malawi. The project educates the locals on how to construct their own wells and installs solar panels in schools and community centres. As an active member of the project, Kamkwamba assists young Malawians in developing DIY solutions to tackle daily difficulties the population face in farming. Kamkwamba's story certainly exemplifies how determination and hard work can make a difference in one's community. Despite facing adversities, he persevered and never stopped learning, encouraging others to keep learning no matter the circumstances."], "questions": [{"n": 31, "q": "In the first paragraph, what can we imply about the importance of Kamkwamba's achievement?", "o": ["It showed how hardworking his country's people were.", "It offered readers an interesting story to read.", "His idea helped people in need.", "His idea could be copied by others."]}, {"n": 32, "q": "As a teenager, William Kamkwamba was keen on", "o": ["learning new things.", "coming up with new ideas.", "writing books.", "buying and selling old objects."]}, {"n": 33, "q": "In line 28 (paragraph 3: 'This is how Kamkwamba discovered…'), 'this' refers to", "o": ["his interest in science.", "discovering the book.", "a source of electricity.", "the way the book was illustrated."]}, {"n": 34, "q": "How did Kamkwamba's neighbours react to his invention?", "o": ["They were all curious to test it.", "They couldn't believe it actually worked.", "They thought it could only be used for phones.", "They talked about it to the media."]}, {"n": 35, "q": "Which of these is <u>not</u> true about Kamkwamba's windmills?", "o": ["He was the only one to work on the first ones.", "They were the reason for his earning a scholarship.", "He produced four windmills before starting to study.", "Their aim was only related to producing electrical power."]}, {"n": 36, "q": "In the last paragraph, what do we learn about Kamkwamba's project on windmills?", "o": ["It is a result of his autobiographic book.", "It works mainly with children.", "It is restricted to Kasungu for now.", "It aims to be both educational and productive."]}], "title": "William Kamkwamba, the boy inventor"}, {"id": "p6", "label": "Part 6", "name": "Gapped text", "type": "gapped", "instr": "You are going to read an article from an online journal about food insecurity. Six sentences have been removed from the article. Choose from the sentences <strong>A–G</strong> the one which fits each gap (37–42). There is <strong>one extra sentence</strong> which you do not need to use.", "title": "Food insecurity", "subtitle": "What are the causes and consequences of this issue, and how can we tackle it?", "options": {"A": "Among these are countries in Sub-Saharan Africa, such as Nigeria and Uganda, India, Pakistan, Haiti, Yemen and Venezuela.", "B": "These are two of the main questions world leaders have been discussing in order to identify the causes and possible solutions to them.", "C": "Together with international organisations, they can invest in social protection programmes, such as cash transfers and food vouchers, in order to support populations at risk.", "D": "As well as being one of the leading causes of food insecurity, it is also one of the most difficult to address.", "E": "This is an extremely complex issue that has various causes, including poverty, climate change, conflict and economic policies.", "F": "For example, extreme weather conditions, such as droughts and floods, can destroy crops and cause food shortages.", "G": "The answer is that, unfortunately, food aid organisations cannot offer sufficient food to meet people's nutritional needs."}, "paragraphs": ["Food insecurity is a major global issue that affects millions of people across the globe. According to the United Nations, more than 820 million people suffer from constant hunger, which means they do not have access to enough food to lead a healthy life. {{37}} In this article, we are going to explore all these causes, but also the consequences of food insecurity and actions that must be taken to end it.", "Two of the main causes of food insecurity are widely known: poverty and economic issues. Poverty is an issue that affects society in many ways, so this may be the reason why it is a major concern. {{38}} People living in poverty often lack the financial resources to access nutritious food. They are also more likely to live in areas where good food isn't available or is expensive. This is often caused by economic policies that tend to prioritise industrial agriculture and exports over small-scale agriculture. As a result, small farmers and Indigenous communities have to move and large amounts of agricultural land is owed by a few powerful people.", "But these are not the only causes. Climate change and conflict-related issues are two other significant reasons why food insecurity exists. {{39}} Climate change also affects food production by altering the quality and quantity of water available for irrigation and affecting the soil's health. Conflict also destroys crops or storage facilities. Because of that, people are forced to leave their homes, and they end up relying on food aid.", "But why is food insecurity such a negative thing? {{40}} This leads to malnutrition, a condition where the body does not get the necessary nutrients to function correctly. Malnutrition can lead to growth problems for children and teenagers, weakened immune systems and several other health problems. Another consequence of food insecurity is social unrest when the population protests in the streets against rising food prices and shortages, especially in local production.", "Unfortunately, this insecurity is present in a number of countries, and despite UN's efforts to fight this off with the Sustainable Development Goals, the number is still concerning. {{41}} The main reasons are that these places face conflict, climate change issues and of course, poverty.", "In order to successfully fight food insecurity, governments can take several actions, including improving access to food, promoting sustainable agriculture, addressing climate change and supporting local communities, among others. {{42}} By encouraging small-scale agriculture and supporting local farmers and food systems, a nation can also help increase food security for their population. Moreover, addressing climate change through reducing greenhouse gas emissions in agriculture may also play a fundamental role in it. Finally, another solution is to reduce poverty."]}, {"id": "p7", "label": "Part 7", "name": "Multiple matching", "type": "matching", "instr": "You are going to read a newspaper article about communities. For questions 43–52, choose from the four sections (<strong>A–D</strong>). The sections may be chosen more than once.", "title": "Communities", "subtitle": "Take a look at some different ideas on the importance of communities.", "people": [{"l": "A", "name": "", "text": "We belong to multiple communities, but not all at once or at the same time. You go to school, might be part of a fandom online, take part in sports club or live in a close-knit neighbourhood. In each of these, you come into contact with people who have similar beliefs and experiences to you. Communities are an essential part of human life, and people have lived in communities since the beginning of time. In prehistoric times, communities provided protection from predators and ensured that everyone had enough to eat and drink. In short, they were necessary for survival. Everybody had their own role to play."}, {"l": "B", "name": "", "text": "Nowadays, communities provide a sense of belonging and social support. Humans are social creatures, and we work better when we spend time with others. Studies have shown that humans need to feel connected to other people, and communities provide that connection. When we feel like we belong to a group, we feel valued and understood. We can share our ups and down with others, and they can provide us with emotional support. This sense of belonging is especially important during times of crisis, as it helps us cope and find strength in numbers. When people feel connected to others in their community, they are more likely to work together to improve their neighbourhood. This could lead to positive social and economic changes, such as lower crime rates."}, {"l": "C", "name": "", "text": "Communities also provide opportunities for learning and growth. In a community, we can learn from others who have different experiences and perspectives. We can become more open-minded and gain new knowledge that we might not have acquired on our own. This is especially common in communities that are open to receiving people from other parts of their country or even the world. Communities also offer resources and services that we might not have access to otherwise. For example, some neighborhoods have community gardens where residents can grow fruit and vegetables to help them through a difficult financial time. Other areas have community centres where people can take classes or access job training programmes."}, {"l": "D", "name": "", "text": "Even though communities are usually based on shared goals and experiences, everyone is different. Each person has their own communication style and wants to fight for what they personally think is the most important. This means that communities often suffer from conflict, usually in the form of disagreement or disputes. These conflicts can arise from differences in opinions, values, or goals. In these situations, bringing in someone from outside the community to act as a negotiator may be useful. Additionally, communities can sometimes become resistant to change. This can occur when a group becomes too comfortable with things as they are and is unwilling to consider new ideas or approaches. When this happens, the community may miss out on opportunities for growth and innovation, for example, the construction of new houses or renovation of unused green space."}], "lead": "Which paragraph", "questions": [[43, "makes a suggestion?"], [44, "talks about communities in the past?"], [45, "mentions organised community activities?"], [46, "explains the emotional benefits of communities?"], [47, "says that communities are something natural?"], [48, "links communities to education?"], [49, "implies that communities involve exchanges?"], [50, "gives examples of how communities provide support?"], [51, "cites the challenges to being in a community?"], [52, "gives examples of communities?"]]}]}
  ]
};

/* =====================================================================
   ENGINE
   ===================================================================== */
const LET = ["A","B","C","D"];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const norm = s => s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"]/g," ").replace(/\s+/g," ").trim();

const REG = {};        // "t1-25" -> {t, p, n, kind}
const PARTQ = {};      // "t1/p4" -> ["t1-25", ...]
const TESTQ = {};      // "t1" -> [...]
const ORDER = [];      // ["t1/p4", ...]
const chosen = {}, graded = {}, checkedParts = {}, submittedTests = {};
let mode = "exam", current = null;

function reg(t, p, n, kind) {
  const k = `${t.id}-${n}`;
  REG[k] = { t: t.id, p: p.id, n, kind };
  (PARTQ[`${t.id}/${p.id}`] ||= []).push(k);
  (TESTQ[t.id] ||= []).push(k);
  return k;
}
const fbDiv = k => `<div class="fb" id="fb-${k}"></div>`;
const optBtn = (k, l, text) => `<button type="button" class="opt" data-k="${k}" data-v="${l}" aria-label="${REG[k].n} ${l}"><span class="letter">${l}</span>${text ? `<span class="opt-text">${esc(text)}</span>` : ""}</button>`;

/* ---------- Split layout (bài đọc cố định bên cạnh câu hỏi) ---------- */
const SPLIT_TYPES = ["mc", "gapped", "matching"];
const pane = (title, html) => `<div class="split-pane"><div class="pane-head"><b>${esc(title)}</b><button type="button" class="pane-close" data-act="pane">Đóng ✕</button></div><div class="pane-body">${html}</div></div>`;
const split = (a, b, paneRight) => `<div class="split${paneRight ? " pane-right" : ""}">${paneRight ? `<div class="split-main">${a}</div>${b}` : `${a}<div class="split-main">${b}</div>`}</div>`;

/* ---------- Renderers ---------- */
const R = {
  kwt(t, p) {
    const e = p.example;
    let h = e ? `<div class="example"><b>Example (0):</b> ${esc(e.orig)} <b>${esc(e.key)}</b><br>${esc(e.pre)} <span class="example-ans">${esc(e.ans)}</span> ${esc(e.post)}</div>` : "";
    return h + p.items.map(i => {
      const k = reg(t, p, i.n, "input");
      return `<div class="card">
        <div class="kwt-original"><span class="qn">${i.n}</span>${esc(i.orig)}</div>
        <span class="kwt-key">${esc(i.key)}</span>
        <div class="kwt-line">${esc(i.pre)} <input class="txt-in" id="in-${k}" data-k="${k}" autocomplete="off" spellcheck="false" placeholder="2–5 words, include ${esc(i.key)}" aria-label="Question ${i.n}"> ${esc(i.post)}</div>
        ${fbDiv(k)}</div>`;
    }).join("");
  },
  mc(t, p) {
    let text = (p.title ? `<h3 class="text-title">${esc(p.title)}</h3>` : "") + (p.subtitle ? `<p class="text-sub">${esc(p.subtitle)}</p>` : "") + `<div class="passage">${p.passage.map(x => `<p>${esc(x)}</p>`).join("")}</div>`;
    if (p.source) text += `<span class="src">${esc(p.source)}</span>`;
    const qs = p.questions.map(q => {
      const k = reg(t, p, q.n, "opt");
      return `<div class="card"><div class="q-title"><span class="qn">${q.n}</span><span>${q.q}</span></div>
        <div class="opts">${q.o.map((o, i) => optBtn(k, LET[i], o)).join("")}</div>${fbDiv(k)}</div>`;
    }).join("");
    return split(pane("Bài đọc", text), qs);
  },
  gapped(t, p) {
    const letters = Object.keys(p.options);
    let h = `<div class="bank">${letters.map(l => `<div class="bank-row"><b>${l}</b><span>${esc(p.options[l])}</span></div>`).join("")}</div>`;
    const keys = [];
    const body = p.paragraphs.map(x => `<p>${esc(x).replace(/\{\{(\d+)\}\}/g, (_, n) => {
      const k = reg(t, p, +n, "select"); keys.push(k);
      return `<span class="gap"><span class="gap-n">${n}</span><select class="gap-sel" id="sel-${k}" data-k="${k}" aria-label="Gap ${n}"><option value="">…</option>${letters.map(l => `<option>${l}</option>`).join("")}</select></span>`;
    })}</p>`).join("");
    const main = `<div class="article">${p.title ? `<h3 class="text-title">${esc(p.title)}</h3>` : ""}${p.subtitle ? `<p class="text-sub">${esc(p.subtitle)}</p>` : ""}${body}</div><div class="fb-list">${keys.map(fbDiv).join("")}</div>`;
    return split(main, pane("Các câu A–" + letters[letters.length - 1], h), true);
  },
  matching(t, p) {
    let h = p.title ? `<h3 class="text-title">${esc(p.title)}</h3>` : "";
    if (p.subtitle) h += `<p class="text-sub">${esc(p.subtitle)}</p>`;
    h += `<div class="people">${p.people.map(x => `<div class="person"><h4><span>${x.l}</span>${esc(x.name)}</h4>${esc(x.text)}</div>`).join("")}</div>`;
    const letters = p.people.map(x => x.l);
    const qs = `<p class="lead">${esc(p.lead || "")}</p>` + p.questions.map(([n, q]) => {
      const k = reg(t, p, n, "opt");
      return `<div class="card"><div class="mm-row"><span class="qn">${n}</span><span class="mm-q">${esc(q)}</span>
        <div class="mm-opts">${letters.map(l => optBtn(k, l)).join("")}</div></div>${fbDiv(k)}</div>`;
    }).join("");
    return split(pane("Bài đọc", h), qs);
  },
  cloze(t, p) {
    const keys = [];
    const exGap = (_, s) => { const [a, stem] = s.split("|");
      return `<span class="gap"><span class="gap-n">0</span><span class="ex-ans">${a}</span>${stem ? ` <span class="stem">(${stem})</span>` : ""}</span>`; };
    const body = p.paragraphs.map(x => `<p>${esc(x).replace(/\{\{0:([^}]*)\}\}/g, exGap).replace(/\{\{(\d+)\}\}/g, (_, n) => {
      if (p.variant === "mc") {
        const k = reg(t, p, +n, "select"); keys.push(k);
        const ch = p.choices[n];
        return `<span class="gap"><span class="gap-n">${n}</span><select class="gap-sel" id="sel-${k}" data-k="${k}" aria-label="Gap ${n}"><option value="">…</option>${ch.map((c, i) => `<option value="${LET[i]}">${LET[i]} ${esc(c)}</option>`).join("")}</select></span>`;
      }
      const k = reg(t, p, +n, "input"); keys.push(k);
      const stem = p.variant === "wordform" && p.stems ? ` <span class="stem">(${esc(p.stems[n])})</span>` : "";
      return `<span class="gap"><span class="gap-n">${n}</span><input class="txt-in" id="in-${k}" data-k="${k}" autocomplete="off" spellcheck="false" aria-label="Gap ${n}">${stem}</span>`;
    })}</p>`).join("");
    return `<div class="article">${p.title ? `<h3 class="text-title">${esc(p.title)}</h3>` : ""}${body}</div><div class="fb-list">${keys.map(fbDiv).join("")}</div>`;
  }
};

/* ---------- Build page ---------- */
function build() {
  document.getElementById("brand").textContent = BOOK.title;
  document.title = BOOK.title;
  const content = document.getElementById("content");
  let toc = "", html = "";
  BOOK.tests.forEach((t, ti) => {
    toc += `<details${ti === 0 ? " open" : ""}><summary><span class="t-title">${esc(t.title)}</span><span class="badge" id="tb-${t.id}"></span></summary>`;
    t.parts.forEach(p => {
      const pk = `${t.id}/${p.id}`; ORDER.push(pk);
      toc += `<a href="#${pk}" class="toc-link" data-part="${pk}"><span>${esc(p.label)}<small>${esc(p.name)}</small></span><span class="badge" id="bd-${t.id}-${p.id}"></span></a>`;
      const isSplit = SPLIT_TYPES.includes(p.type);
      html += `<section class="part ${isSplit ? "split-part" : "narrow"}" id="sec-${t.id}-${p.id}" hidden>
        ${isSplit ? `<button type="button" class="pane-btn" data-act="pane">${p.type === "gapped" ? "📋 Xem câu A–G" : "📖 Xem bài đọc"}</button>` : ""}
        <div class="crumb">${esc(t.title)} › ${esc(p.label)}</div>
        <h2>${esc(p.label)} — ${esc(p.name)}</h2>
        <div class="results only-exam" data-test="${t.id}"></div>
        <div class="instr">${p.instr || ""}</div>
        ${R[p.type](t, p)}
        <div class="part-actions">
          <span class="status" id="st-${t.id}-${p.id}"></span>
          <span class="timer" id="tm-${t.id}-${p.id}" title="Thời gian làm Part này">⏱ 0:00</span>
          <button type="button" class="btn btn-nav" data-act="prev" data-part="${pk}">← Trước</button>
          <button type="button" class="btn btn-nav" data-act="next" data-part="${pk}">Tiếp →</button>
          <button type="button" class="btn btn-ghost only-practice" data-act="redo" data-part="${pk}">Làm lại Part</button>
          <button type="button" class="btn btn-primary only-practice" data-act="check" data-part="${pk}">Kiểm tra ${esc(p.label)}</button>
          <button type="button" class="btn btn-ghost only-exam" data-act="redoTest" data-test="${t.id}">Làm lại ${esc(t.title)}</button>
          <button type="button" class="btn btn-primary only-exam" data-act="submit" data-test="${t.id}">Nộp bài ${esc(t.title)}</button>
        </div>
      </section>`;
    });
    toc += `</details>`;
  });
  document.getElementById("toc").innerHTML = toc;
  content.innerHTML = html;
}

/* ---------- Answers ---------- */
const key = k => KEYS[REG[k].t][REG[k].n];
function value(k) {
  const r = REG[k];
  if (r.kind === "input") return document.getElementById("in-" + k).value.trim();
  if (r.kind === "select") return document.getElementById("sel-" + k).value;
  return chosen[k] || "";
}
const answered = k => value(k) !== "";
const locked = k => k in graded;

function grade(k) {
  const r = REG[k], a = key(k), v = value(k);
  const ok = v !== "" && (a.acc ? a.acc.includes(norm(v)) : v === a.ans);
  graded[k] = ok;
  if (r.kind === "input") {
    const el = document.getElementById("in-" + k); el.classList.add(ok ? "ok" : "err"); el.readOnly = true;
  } else if (r.kind === "select") {
    const el = document.getElementById("sel-" + k); el.classList.add(ok ? "ok" : "err"); el.disabled = true;
  } else {
    document.querySelectorAll(`.opt[data-k="${k}"]`).forEach(o => {
      o.disabled = true; o.classList.remove("chosen");
      if (o.dataset.v === v) o.classList.add(ok ? "r-ok" : "r-err");
      if (!ok && o.dataset.v === a.ans) o.classList.add("r-ok");
    });
  }
  const fb = document.getElementById("fb-" + k);
  const label = r.kind === "select" || (r.kind === "input" && !document.getElementById("in-" + k).closest(".kwt-line")) ? `<b>Câu ${r.n}:</b> ` : "";
  fb.className = "fb show " + (ok ? "ok" : "err");
  fb.innerHTML = ok ? `${label}✓ Correct!`
    : `${label}${v === "" ? "✗ Chưa trả lời." : "✗ Chưa đúng."} Đáp án: <span class="ans">${esc(a.ans)}</span>${a.hint ? `<span class="hint">${esc(a.hint)}</span>` : ""}`;
}
function clear(k) {
  const r = REG[k];
  delete graded[k]; delete chosen[k];
  if (r.kind === "input") { const el = document.getElementById("in-" + k); el.value = ""; el.className = "txt-in"; el.readOnly = false; }
  else if (r.kind === "select") { const el = document.getElementById("sel-" + k); el.value = ""; el.className = "gap-sel"; el.disabled = false; }

}

function confirmMissing(keys) {
  const miss = keys.filter(k => !answered(k)).map(k => REG[k].n);
  return !miss.length || confirm(`Còn ${miss.length} câu chưa làm (${miss.join(", ")}). Câu bỏ trống tính là sai. Vẫn chấm?`);
}
function checkPart(pk) {
  const keys = PARTQ[pk];
  if (checkedParts[pk]) return;
  if (!user) { askName(() => checkPart(pk)); return; }
  if (!confirmMissing(keys)) return;
  keys.forEach(grade); checkedParts[pk] = true; refresh();
  const [tid] = pk.split("/");
  sendResult({ mode: "Luyện tập", testId: tid, testTitle: testById(tid).title, parts: [partPayload(pk)] });
}
function submitTest(tid) {
  const keys = TESTQ[tid];
  if (submittedTests[tid]) return;
  if (!user) { askName(() => submitTest(tid)); return; }
  if (!confirmMissing(keys)) return;
  keys.forEach(grade); submittedTests[tid] = true;
  const t = BOOK.tests.find(x => x.id === tid);
  sendResult({ mode: "Thi", testId: tid, testTitle: t.title, parts: t.parts.map(p => partPayload(`${tid}/${p.id}`)) });
  let total = 0;
  const rows = t.parts.map(p => {
    const ks = PARTQ[`${tid}/${p.id}`], r = ks.filter(k => graded[k]).length; total += r;
    return `<div class="res-row"><span>${esc(p.label)} · ${esc(p.name)}</span><b>${r} / ${ks.length}</b></div>`;
  }).join("");
  document.querySelectorAll(`.results[data-test="${tid}"]`).forEach(el => {
    el.innerHTML = `<h3>Kết quả ${esc(t.title)}</h3>${rows}<div class="res-row total"><span>Tổng</span><b>${total} / ${keys.length}</b></div>`;
    el.classList.add("show");
  });
  refresh(); window.scrollTo({ top: 0, behavior: "smooth" });
}
function resetKeys(keys) { keys.forEach(clear); new Set(keys.map(k => `${REG[k].t}/${REG[k].p}`)).forEach(pk => { timeMs[pk] = 0; }); }
function resetAll() {
  Object.keys(REG).forEach(clear);
  for (const o of [checkedParts, submittedTests, timeMs]) for (const k in o) delete o[k];
  document.querySelectorAll(".results").forEach(el => { el.classList.remove("show"); el.innerHTML = ""; });
  refresh();
}

/* ---------- Status ---------- */
function refresh() {
  BOOK.tests.forEach(t => {
    let tr = 0;
    t.parts.forEach(p => {
      const pk = `${t.id}/${p.id}`, ks = PARTQ[pk], n = ks.length;
      const a = ks.filter(answered).length, r = ks.filter(k => graded[k]).length; tr += r;
      const done = mode === "exam" ? !!submittedTests[t.id] : !!checkedParts[pk];
      const bd = document.getElementById(`bd-${t.id}-${p.id}`);
      bd.textContent = done ? `${r}/${n}` : `${a}/${n}`;
      bd.className = "badge" + (done ? " done" : "");
      bd.title = done ? "Số câu đúng" : "Số câu đã làm";
      document.getElementById(`st-${t.id}-${p.id}`).innerHTML = done
        ? `Kết quả: <b>${r}/${n}</b> câu đúng`
        : `Đã làm ${a}/${n} câu`;
      document.querySelector(`[data-act="check"][data-part="${pk}"]`).disabled = !!checkedParts[pk];
    });
    const tb = document.getElementById("tb-" + t.id);
    tb.textContent = mode === "exam" && submittedTests[t.id] ? `${tr}/${TESTQ[t.id].length}` : "";
    tb.className = "badge" + (tb.textContent ? " done" : "");
    tb.style.display = tb.textContent ? "" : "none";
    document.querySelectorAll(`[data-act="submit"][data-test="${t.id}"]`).forEach(b => b.disabled = !!submittedTests[t.id]);
  });
}

/* ---------- Gói kết quả ---------- */
function displayVal(k, letter) {
  const r = REG[k];
  if (!letter) return "";
  if (r.kind === "select") {
    const p = partById(r.t, r.p);
    if (p.type === "cloze" && p.variant === "mc") return `${letter} ${p.choices[r.n][LET.indexOf(letter)]}`;
  }
  return r.kind === "input" ? letter.toUpperCase() : letter;
}
function partPayload(pk) {
  const [tid, pid] = pk.split("/"), p = partById(tid, pid), ks = PARTQ[pk];
  const answers = ks.map(k => ({ n: REG[k].n, g: displayVal(k, value(k)), c: displayVal(k, key(k).ans) || key(k).ans, ok: !!graded[k] }));
  return { id: pid, label: p.label, name: p.name, score: answers.filter(a => a.ok).length, total: ks.length,
           seconds: Math.round((timeMs[pk] || 0) / 1000), answers };
}

/* ---------- Gửi kết quả (có hàng đợi, tự gửi lại khi mất mạng) ---------- */
function toast(msg, isErr) {

async function postResult(payload) {
  const body = JSON.stringify(payload);
  try {
    const r = await fetch(API_URL, { method: "POST", body });
    const d = await r.json();
    return !!d.ok;
  } catch (e) {
    try { await fetch(API_URL, { method: "POST", mode: "no-cors", body }); return true; } catch (e2) { return false; }
  }
}
async function flushOutbox() {
  let box = store.get("b2.outbox", []);
  if (!box.length) return true;
  const left = [];
  for (const item of box) if (!(await postResult(item))) left.push(item);
  store.set("b2.outbox", left);
  return left.length === 0;
}
async function sendResult(data) {
  const payload = Object.assign({ name: user.name, group: user.group || "", submittedAt: new Date().toISOString(),
    session: Date.now().toString(36) + Math.random().toString(36).slice(2, 7) }, data);
  const box = store.get("b2.outbox", []); box.push(payload); store.set("b2.outbox", box);

}

function jsonp(url) {

function aggregate(rows) {
  const atts = {}, types = {}, qs = {}, studs = {};
  rows.forEach(r => {
    const sk = r.session + "|" + r.name;
    const a = atts[sk] ||= { name: r.name, group: r.group, mode: r.mode, testTitle: r.testTitle, testId: r.testId, time: r.time, parts: [], score: 0, total: 0, seconds: 0 };
    a.parts.push(r); a.score += +r.score || 0; a.total += +r.total || 0; a.seconds += +r.seconds || 0;
    if (r.time > a.time) a.time = r.time;
    const tk = `${r.label} · ${r.partName}`;
    const ty = types[tk] ||= { label: tk, ok: 0, n: 0 };
    ty.ok += +r.score || 0; ty.n += +r.total || 0;
    const st = studs[r.name] ||= { name: r.name, group: r.group, ok: 0, n: 0, sessions: new Set(), types: {}, last: r.time };
    st.ok += +r.score || 0; st.n += +r.total || 0; st.sessions.add(r.session); if (r.time > st.last) st.last = r.time;
    const stt = st.types[tk] ||= { ok: 0, n: 0 }; stt.ok += +r.score || 0; stt.n += +r.total || 0;
    (r.answers || []).forEach(x => {
      const qk = `${r.testId}|${x.n}`;
      const q = qs[qk] ||= { testTitle: r.testTitle, n: x.n, type: tk, c: x.c, wrong: 0, n2: 0, wrongs: {} };
      q.n2++;
      if (!x.ok) { q.wrong++; const g = x.g || "(bỏ trống)"; q.wrongs[g] = (q.wrongs[g] || 0) + 1; }
    });
  });
  return { atts: Object.values(atts).sort((a, b) => a.time < b.time ? 1 : -1), types: Object.values(types), qs: Object.values(qs), studs: Object.values(studs) };
}

function renderHistory() {
  const f = store.get("b2.hfilter", {});
  const names = [...new Set(histRows.map(r => r.name))].sort((a, b) => a.localeCompare(b, "vi"));
  const tests = [...new Set(histRows.map(r => r.testTitle))].sort();
  const rows = histRows.filter(r => (!f.name || r.name === f.name) && (!f.test || r.testTitle === f.test) && (!f.mode || r.mode === f.mode));
  const A = aggregate(rows);
  const opt = (v, cur, label) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(label || v)}</option>`;
  const totalOk = A.types.reduce((s, x) => s + x.ok, 0), totalN = A.types.reduce((s, x) => s + x.n, 0);

  const typeRows = A.types.map(x => ({ ...x, err: x.n ? 1 - x.ok / x.n : 0 })).sort((a, b) => b.err - a.err);
  const bars = typeRows.map(x => {
    const cls = x.err >= 0.4 ? "bad" : x.err >= 0.25 ? "mid" : "";
    return `<div class="bar-row ${cls}"><span class="lbl" title="${esc(x.label)}">${esc(x.label)}</span>

  }).join("") || "<p>Chưa có dữ liệu.</p>";

  const studTable = A.studs.length ? `<table class="h-table"><thead><tr><th>Học sinh</th><th class="num">Lượt</th><th class="num">Đúng</th><th>Dạng yếu nhất</th></tr></thead><tbody>${
    A.studs.sort((a, b) => a.name.localeCompare(b.name, "vi")).map(s => {
      const weak = Object.entries(s.types).filter(([, v]) => v.n >= 3).map(([k, v]) => [k, v.ok / v.n]).sort((a, b) => a[1] - b[1])[0];
      const p = s.n ? s.ok / s.n : 0;
      return `<tr><td><b>${esc(s.name)}</b>${s.group ? ` <small>${esc(s.group)}</small>` : ""}</td><td class="num">${s.sessions.size}</td>
        <td class="num"><span class="chip ${pctClass(p)}">${Math.round(p * 100)}%</span></td>
        <td>${weak && weak[1] < 0.8 ? `<span class="chip weak">⚠ ${esc(weak[0].split(" · ")[0])} – ${Math.round(weak[1] * 100)}%</span> <small>${esc(weak[0].split(" · ")[1])}</small>` : "—"}</td></tr>`;
    }).join("")}</tbody></table>` : "<p>Chưa có dữ liệu.</p>";

  const attRows = A.atts.map((a, i) => {
    const id = a.parts[0].session + "|" + a.name;
    const chips = a.parts.map(p => `<span class="chip ${pctClass(p.total ? p.score / p.total : 0)}" title="${esc(p.partName)}">${esc(p.label.replace("Part ", "P"))} ${p.score}/${p.total}</span>`).join("");
    const when = new Date(a.time);
    const fresh = histNew[id] && Date.now() - histNew[id] < 120000;
    const main = `<tr class="att${fresh ? " fresh" : ""}" data-att="${esc(id)}"><td><b>${esc(a.name)}</b>${fresh ? ' <span class="new-tag">Mới</span>' : ""}${a.group ? `<br><small>${esc(a.group)}</small>` : ""}</td>
      <td class="hide-m">${isNaN(when) ? esc(a.time) : when.toLocaleString("vi-VN", { dateStyle: "short", timeStyle: "short" })}</td>
      <td>${esc(a.testTitle)}<br><small>${esc(a.mode)}</small></td><td>${chips}</td>
      <td class="num"><span class="chip ${pctClass(a.total ? a.score / a.total : 0)}">${a.score}/${a.total}</span></td><td class="num">${fmtSec(a.seconds)}</td>
      <td class="num"><span class="more-btn${histOpen[id] ? " open" : ""}">${histOpen[id] ? "▴ Thu gọn" : "▾ Chi tiết"}</span></td></tr>`;
    if (!histOpen[id]) return main;
    const det = a.parts.map(p => `<div class="d-part"><h4>${esc(p.label)} · ${esc(p.partName)} <span>— ${p.score}/${p.total} câu đúng · ⏱ ${fmtSec(p.seconds)}</span></h4>
      <div class="ans-grid">${(p.answers || []).map(x => x.ok
        ? `<span class="ans"><b>${x.n}</b>✓ ${esc(x.g)}</span>`
        : `<span class="ans x"><b>${x.n}</b>✗ ${esc(x.g || "(bỏ trống)")} → <em>${esc(x.c)}</em></span>`).join("")}</div></div>`).join("");
    return main + `<tr class="detail"><td colspan="7">${det}</td></tr>`;
  }).join("");

  histShell(`
    <div class="h-toolbar">
      <label>Học sinh<select id="hf-name">${opt("", f.name, "Tất cả")}${names.map(n => opt(n, f.name)).join("")}</select></label>
      <label>Test<select id="hf-test">${opt("", f.test, "Tất cả")}${tests.map(n => opt(n, f.test)).join("")}</select></label>
      <label>Chế độ<select id="hf-mode">${opt("", f.mode, "Tất cả")}${opt("Thi", f.mode)}${opt("Luyện tập", f.mode)}</select></label>
      <label>Tự cập nhật<select id="hf-auto">${[[5, "5 giây"], [10, "10 giây"], [30, "30 giây"], [0, "Tắt"]].map(([v, l]) => `<option value="${v}"${v === +store.get("b2.hauto", 10) ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <button type="button" class="btn btn-ghost" id="hf-reload">⟳ Tải lại toàn bộ</button>
    </div>
    <div class="h-sync" id="h-sync"></div>
    <div class="h-stats">
      <div class="h-stat"><b>${A.atts.length}</b><span>Lượt làm bài</span></div>
      <div class="h-stat"><b>${A.studs.length}</b><span>Học sinh</span></div>
      <div class="h-stat"><b>${totalN ? Math.round(totalOk / totalN * 100) : 0}%</b><span>Tỉ lệ đúng trung bình</span></div>
      <div class="h-stat"><b>${typeRows[0] && typeRows[0].err > 0 ? esc(typeRows[0].label.split(" · ")[0]) : "—"}</b><span>Dạng sai nhiều nhất</span></div>
    </div>
    <div class="h-card alert" style="margin-bottom:16px"><h3>⚠️ Dạng bài hay sai (tỉ lệ câu sai)</h3>${bars}</div>
    <div class="h-card" style="margin-bottom:16px"><h3>👥 Theo học sinh</h3>${studTable}</div>
    <div class="h-card"><h3 class="att-head">📝 Các lượt làm bài ${A.atts.length ? '<span class="blink-hint">👆 Bấm vào từng bạn để xem kết quả chi tiết</span>' : ""}</h3>
      ${A.atts.length ? `<table class="h-table"><thead><tr><th>Học sinh</th><th class="hide-m">Thời điểm</th><th>Test</th><th>Điểm từng Part</th><th class="num">Tổng</th><th class="num">Thời gian</th><th></th></tr></thead><tbody>${attRows}</tbody></table>` : "<p>Chưa có lượt làm bài nào.</p>"}
    </div>`);
  ["name", "test", "mode"].forEach(x => document.getElementById("hf-" + x).onchange = e => { const nf = store.get("b2.hfilter", {}); nf[x] = e.target.value; store.set("b2.hfilter", nf); renderHistory(); });
  document.getElementById("hf-auto").onchange = e => { store.set("b2.hauto", +e.target.value); histTry = 0; setSync(); };
  document.getElementById("hf-reload").onclick = () => { clearHist(); loadHistory(); };
  setSync();
  document.querySelectorAll("tr.att").forEach(tr => tr.onclick = () => { const id = tr.dataset.att; histOpen[id] = !histOpen[id]; renderHistory(); });
}

/* =====================================================================
   TRA NGHĨA KHI BÔI CHỌN + KHO TỪ VỰNG
   ===================================================================== */
const vocabKey = () => "b2.vocab:" + (user ? user.name.toLowerCase() : "");
const getVocab = () => user ? store.get(vocabKey(), []) : [];
const setVocab = v => { if (user) store.set(vocabKey(), v); updateVocabCount(); };
function updateVocabCount() {
  const el = document.getElementById("vocab-count"); if (!el) return;
  const n = getVocab().length; el.textContent = n ? n : ""; el.style.display = n ? "" : "none";
}
const trCache = store.get("b2.trcache", {});
function cacheTr(k, v) {
  trCache[k] = v; const ks = Object.keys(trCache);
  if (ks.length > 600) ks.slice(0, ks.length - 600).forEach(x => delete trCache[x]);
  store.set("b2.trcache", trCache);
}
async function translateText(q) {
  const k = q.toLowerCase();
  if (trCache[k]) return trCache[k];
  let text = "";
  try {
    const d = await getJSON(`${API_URL}?action=translate&q=${encodeURIComponent(q)}`);
    if (d && d.ok && d.text) text = d.text;
  } catch (e) {}
  if (!text) {  // dự phòng khi Apps Script chưa cập nhật
    try {
      const r = await fetch(`https://api.mymemory.translated.net/get?langpair=en|vi&q=${encodeURIComponent(q)}`);
      const d = await r.json(); text = (d.responseData && d.responseData.translatedText) || "";
    } catch (e) {}
  }
  if (text) cacheTr(k, text);
  return text;
}
async function lookupDict(word) {
  const k = "dict:" + word.toLowerCase();
  if (trCache[k]) return trCache[k];
  try {
    const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase())}`);
    if (!r.ok) return null;
    const d = (await r.json())[0] || {};
    const ipa = d.phonetic || ((d.phonetics || []).find(p => p.text) || {}).text || "";
    const m = (d.meanings || [])[0] || {};
    const out = { ipa, pos: m.partOfSpeech || "", def: ((m.definitions || [])[0] || {}).definition || "" };
    cacheTr(k, out); return out;
  } catch (e) { return null; }
}
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => /^en(-|_)GB/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { toast("Trình duyệt này chưa hỗ trợ đọc phát âm.", true); }
}

/* ---------- bắt sự kiện bôi chọn ---------- */
let lk = null;   // {word, context, source, meaning, ipa, pos}
function sentenceAround(node, text) {
  const host = node.parentElement.closest("p, .card, .bank-row, .person, .kwt-original, .q-title, .mm-q") || node.parentElement;
  const full = host.textContent.replace(/\s+/g, " ").trim();
  const i = full.toLowerCase().indexOf(text.toLowerCase());
  if (i < 0) return full.slice(0, 300);
  const s = Math.max(full.lastIndexOf(". ", i), full.lastIndexOf("? ", i), full.lastIndexOf("! ", i));
  let e = full.slice(i + text.length).search(/[.?!](\s|$)/);
  e = e < 0 ? full.length : i + text.length + e + 1;
  return full.slice(s < 0 ? 0 : s + 2, e).trim().slice(0, 400);
}
function onSelect() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  const text = sel.toString().replace(/\s+/g, " ").trim().replace(/^[^A-Za-z'’]+|[^A-Za-z'’]+$/g, "");
  if (!text || text.length > 80 || text.split(" ").length > 8 || !/[A-Za-z]/.test(text)) return;
  const range = sel.getRangeAt(0), node = range.startContainer;
  const el = node.nodeType === 1 ? node : node.parentElement;
  if (!el || !el.closest("#content .part") || el.closest("input, select, textarea, .fb, .part-actions, .results, .instr")) return;
  const sec = el.closest(".part"), [, tid, pid] = sec.id.split("-");
  if (mode === "exam" && !submittedTests[tid]) { toast("Chế độ Thi: tra nghĩa sẽ mở sau khi nộp bài."); return; }
  const t = testById(tid), p = t && partById(tid, pid);
  lk = { word: text, context: sentenceAround(node.nodeType === 3 ? node : node.firstChild || node, text), source: p ? `${t.title} · ${p.label}` : "" };
  openLookup(range.getBoundingClientRect());
}
function placeLookup(rect) {
  const box = document.getElementById("lookup");
  const w = box.offsetWidth, h = box.offsetHeight, vw = innerWidth, vh = innerHeight;
  let x = Math.min(Math.max(10, rect.left + rect.width / 2 - w / 2), vw - w - 10);
  let y = rect.bottom + 10;
  if (y + h > vh - 10) y = Math.max(10, rect.top - h - 10);
  box.style.left = x + "px"; box.style.top = y + "px";
}
function vocabHas(word) { return getVocab().some(v => v.word.toLowerCase() === word.toLowerCase()); }
function renderLookup() {
  const box = document.getElementById("lookup"), single = !/\s/.test(lk.word);
  const saved = vocabHas(lk.word);
  const ctxHtml = esc(lk.context).replace(new RegExp(lk.word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), m => `<b>${m}</b>`);
  box.innerHTML = `
    <div class="lk-head">
      <div class="lk-word">${esc(lk.word)}${(lk.ipa || lk.pos) ? `<div class="lk-sub">${lk.ipa ? `<span class="lk-ipa">${esc(lk.ipa)}</span>` : ""}${lk.pos ? `<span class="lk-pos">${esc(lk.pos)}</span>` : ""}</div>` : ""}</div>
      <button type="button" class="lk-icon" data-lk="speak" title="Nghe phát âm" aria-label="Nghe phát âm">🔊</button>
      <button type="button" class="lk-icon" data-lk="close" title="Đóng" aria-label="Đóng">✕</button>
    </div>
    <div class="lk-mean">${lk.meaning ? esc(lk.meaning) : `<span class="lk-loading">Đang tra nghĩa…</span>`}</div>
    ${single && lk.def ? `<div class="lk-def">${esc(lk.def)}</div>` : ""}
    ${lk.context && lk.context.toLowerCase() !== lk.word.toLowerCase() ? `<div class="lk-sent">${ctxHtml}${lk.sentVi ? `<span class="vi">→ ${esc(lk.sentVi)}</span>` : ""}</div>` : ""}
    <div class="lk-btns">
      <button type="button" class="btn ${saved ? "saved" : "btn-primary"}" data-lk="save"${saved ? " disabled" : ""}>${saved ? "✓ Đã có trong kho" : "➕ Thêm vào kho từ vựng"}</button>
      ${lk.context && !lk.sentVi ? `<button type="button" class="btn btn-ghost" data-lk="sent">Dịch cả câu</button>` : ""}
    </div>`;
}
async function openLookup(rect) {
  const box = document.getElementById("lookup"), my = lk;
  box.hidden = false; renderLookup(); placeLookup(rect);
  const single = !/\s/.test(my.word);
  const [mean, dict] = await Promise.all([translateText(my.word), single ? lookupDict(my.word) : Promise.resolve(null)]);
  if (lk !== my) return;
  my.meaning = mean || "(Chưa tra được nghĩa — kiểm tra kết nối mạng)";
  if (dict) Object.assign(my, { ipa: dict.ipa, pos: dict.pos, def: dict.def });
  renderLookup(); placeLookup(rect);
}
function hideLookup() { const b = document.getElementById("lookup"); if (b) b.hidden = true; lk = null; }

document.addEventListener("mouseup", e => { if (!e.target.closest("#lookup")) setTimeout(onSelect, 10); });
document.addEventListener("touchend", e => { if (!e.target.closest("#lookup")) setTimeout(onSelect, 350); });
document.addEventListener("mousedown", e => { if (!e.target.closest("#lookup")) hideLookup(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hideLookup(); });
document.addEventListener("scroll", e => { if (!(e.target.closest && e.target.closest("#lookup"))) hideLookup(); }, true);
document.getElementById("lookup").addEventListener("click", async e => {
  const b = e.target.closest("[data-lk]"); if (!b || !lk) return;
  const a = b.dataset.lk;
  if (a === "close") hideLookup();
  if (a === "speak") speak(lk.word);
  if (a === "sent") {
    const my = lk; b.disabled = true; b.textContent = "Đang dịch…";
    const vi = await translateText(my.context);
    if (lk === my) { my.sentVi = vi || "(chưa dịch được)"; renderLookup(); }
  }
  if (a === "save") {
    const my = lk;
    if (!user) { askName(() => { if (lk === my) saveWord(my); }); return; }
    saveWord(my);
  }
});

/* ---------- lưu / xoá ---------- */
function saveWord(w) {
  if (vocabHas(w.word)) { renderLookup(); return; }
  const item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), word: w.word,
    meaning: w.meaning && !w.meaning.startsWith("(") ? w.meaning : "", ipa: w.ipa || "", pos: w.pos || "",
    context: w.context || "", source: w.source || "", time: new Date().toISOString() };
  const v = getVocab(); v.unshift(item); setVocab(v);
  const box = store.get("b2.outbox", []); box.push({ type: "vocab_add", name: user.name, group: user.group || "", item }); store.set("b2.outbox", box);
  flushOutbox();
  toast(`✓ Đã thêm “${w.word}” vào kho từ vựng`);
  if (lk === w) renderLookup();
  if (!document.getElementById("sec-vocab").hidden) renderVocab();
}
function deleteWord(id) {
  const v = getVocab(), it = v.find(x => x.id === id); if (!it) return;
  if (!confirm(`Xoá “${it.word}” khỏi kho từ vựng?`)) return;
  setVocab(v.filter(x => x.id !== id));
  const box = store.get("b2.outbox", []).filter(x => !(x.type === "vocab_add" && x.item && x.item.id === id));
  box.push({ type: "vocab_del", name: user.name, id }); store.set("b2.outbox", box);
  flushOutbox(); renderVocab();
}

/* ---------- tab Kho từ vựng ---------- */
let vocabSynced = {};
function showVocab() {
  current = null;
  document.querySelectorAll("#content .part").forEach(s => s.hidden = true);
  document.getElementById("sec-vocab").hidden = false;
  document.querySelectorAll(".toc-link").forEach(a => a.classList.toggle("active", a.dataset.part === "vocab"));
  if (location.hash !== "#vocab") history.replaceState(null, "", "#vocab");
  document.body.classList.remove("nav-open");
  window.scrollTo({ top: 0 });
  renderVocab();
  if (user && !vocabSynced[user.name]) syncVocab();
}
async function syncVocab() {
  if (!user) return;
  const name = user.name;
  try {
    await flushOutbox();
    const d = await getJSON(`${API_URL}?action=vocab&name=${encodeURIComponent(name)}&_=${Date.now()}`);
    if (!d || !d.ok || !Array.isArray(d.items) || !user || user.name !== name) return;
    const pend = store.get("b2.outbox", []);
    const pendAdd = new Set(pend.filter(x => x.type === "vocab_add").map(x => x.item.id));
    const pendDel = new Set(pend.filter(x => x.type === "vocab_del").map(x => x.id));
    const server = d.items.filter(x => !pendDel.has(x.id));
    const ids = new Set(server.map(x => x.id));
    const merged = getVocab().filter(x => pendAdd.has(x.id) && !ids.has(x.id)).concat(server)
      .sort((a, b) => (a.time < b.time ? 1 : -1));
    setVocab(merged); vocabSynced[name] = true;
    if (!document.getElementById("sec-vocab").hidden) renderVocab();
  } catch (e) {}
}
function renderVocab() {
  const sec = document.getElementById("sec-vocab");
  const head = `<div class="crumb">Học sinh</div><h2>📚 Kho từ vựng của tôi</h2>`;
  if (!user) {
    sec.innerHTML = head + `<div class="v-empty">Nhập họ tên để có kho từ vựng riêng. <button type="button" class="btn btn-primary" id="v-name">Nhập tên</button></div>`;
    document.getElementById("v-name").onclick = () => askName(() => showVocab());
    return;
  }
  const q = (store.get("b2.vq", "") || "").toLowerCase(), hide = !!store.get("b2.vhide", false);
  const all = getVocab(), list = all.filter(v => !q || (v.word + " " + v.meaning).toLowerCase().includes(q));
  const pend = new Set(store.get("b2.outbox", []).filter(x => x.type === "vocab_add").map(x => x.item.id));
  const re = w => new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
  const cards = list.map(v => `<div class="v-card">
      <div class="v-top"><span class="v-word">${esc(v.word)}${v.ipa || v.pos ? `<div class="lk-sub">${v.ipa ? `<span class="lk-ipa">${esc(v.ipa)}</span>` : ""}${v.pos ? `<span class="lk-pos">${esc(v.pos)}</span>` : ""}</div>` : ""}</span>
        <button type="button" class="lk-icon" data-vs="${esc(v.word)}" aria-label="Nghe phát âm">🔊</button>
        <button type="button" class="v-del" data-vd="${esc(v.id)}" title="Xoá" aria-label="Xoá">🗑</button></div>
      <div class="v-mean" title="${hide ? "Bấm để xem nghĩa" : ""}">${esc(v.meaning || "—")}</div>
      ${v.context ? `<div class="v-ctx">${esc(v.context).replace(re(v.word), m => `<mark>${m}</mark>`)}</div>` : ""}
      <div class="v-meta"><span>${esc(v.source || "")}</span><span>${pend.has(v.id) ? '<span class="v-pending">chưa đồng bộ</span> ' : ""}${new Date(v.time).toLocaleDateString("vi-VN")}</span></div>
    </div>`).join("");
  sec.innerHTML = head + `
    <div class="v-toolbar">
      <input type="search" id="v-q" placeholder="Tìm từ hoặc nghĩa…" value="${esc(store.get("b2.vq", ""))}">
      <label><input type="checkbox" id="v-hide"${hide ? " checked" : ""}> Ẩn nghĩa để tự kiểm tra</label>
      <span style="font-weight:800;color:var(--accent-strong)">${all.length} từ</span>
    </div>
    ${all.length ? (list.length ? `<div class="v-grid${hide ? " hide-mean" : ""}">${cards}</div>` : `<div class="v-empty">Không tìm thấy từ phù hợp.</div>`)
      : `<div class="v-empty"><b>Kho từ vựng đang trống.</b><br>Khi làm bài, hãy <b>bôi đen (hoặc nháy đúp) một từ hay cụm từ</b> trong bài đọc để xem nghĩa, rồi bấm <b>“➕ Thêm vào kho từ vựng”</b>.${mode === "exam" ? "<br>Ở chế độ Thi, tra nghĩa mở sau khi nộp bài; chế độ Luyện tập tra được ngay." : ""}</div>`}`;
  const qi = document.getElementById("v-q");
  qi.oninput = () => { store.set("b2.vq", qi.value); const pos = qi.selectionStart; renderVocab(); const n = document.getElementById("v-q"); n.focus(); n.setSelectionRange(pos, pos); };
  document.getElementById("v-hide").onchange = e => { store.set("b2.vhide", e.target.checked); renderVocab(); };
  sec.querySelectorAll("[data-vs]").forEach(b => b.onclick = () => speak(b.dataset.vs));
  sec.querySelectorAll("[data-vd]").forEach(b => b.onclick = () => deleteWord(b.dataset.vd));
  sec.querySelectorAll(".hide-mean .v-mean").forEach(m => m.onclick = () => m.classList.toggle("show"));
}

build(); bind(); bindName(); renderUser(); setMode("exam"); show(location.hash.slice(1)); updateVocabCount();
if (!user) askName(null);
flushOutbox();
</script>
</body>
</html>
